<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стратегія</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--panel:#141416;--panel2:#1a1a1c;--line:rgba(244,243,238,.13);--line2:rgba(244,243,238,.24);--tx:#f4f3ee;--tx2:#a5a49d;--tx3:#6c6b66;
--ac:#cbff2e;--ac2:rgba(203,255,46,.10);--acink:#0c1300;--acline:rgba(203,255,46,.38);
--r:18px;--fd:'Unbounded','Manrope',sans-serif;--fb:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{font:15px/1.65 var(--fb);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
.blob{position:fixed;width:52vw;height:52vw;max-width:760px;max-height:760px;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none;z-index:0}
.blob.b1{background:var(--ac);top:-18vw;left:-16vw}
.blob.b2{background:var(--ac);bottom:-20vw;right:-18vw}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--ac);z-index:40;width:0%;box-shadow:0 0 12px var(--ac);transition:width .08s linear}

.page{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,860px);gap:0;justify-content:center}
.toc{position:sticky;top:0;align-self:start;height:100vh;padding:38px 14px 40px 28px;overflow-y:auto;scrollbar-width:thin}
.toc-inner{display:flex;flex-direction:column;gap:2px}
.toc-brand{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin:0 0 16px;display:flex;align-items:center;gap:8px}
.toc-brand i{width:8px;height:8px;border-radius:2px;background:var(--ac);display:inline-block;flex:none}
.toc a{color:var(--tx3);text-decoration:none;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:9px;border-left:2px solid transparent;transition:color .15s,background .15s,border-color .15s;line-height:1.35}
.toc a:hover{color:var(--tx);background:var(--panel2)}
.toc a.active{color:var(--ac);background:var(--ac2);border-left-color:var(--ac)}
.toc-progress{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);color:var(--tx3);font-size:11px;letter-spacing:.04em}

.wrap{padding:64px 24px 140px;min-width:0}
.hero{padding:40px 0 26px;border-bottom:1px solid var(--line)}
.hero .brand{font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.hero .brand i{width:10px;height:10px;border-radius:3px;background:var(--ac);display:inline-block}
.hero h1{font-family:var(--fd);font-weight:800;font-size:clamp(28px,5vw,46px);line-height:1.08;margin:0 0 14px;text-transform:uppercase;letter-spacing:-.01em}
.hero .meta{color:var(--tx2);font-size:13.5px}
.hero .readtime{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.hero .readtime i{width:6px;height:6px;border-radius:50%;background:var(--ac);display:inline-block}

h2.sec{font-family:var(--fd);font-weight:800;font-size:clamp(20px,3.4vw,30px);text-transform:uppercase;letter-spacing:-.005em;margin:0 0 4px;padding-top:28px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;scroll-margin-top:24px}
h2.sec i{width:22px;height:4px;background:var(--ac);border-radius:3px;display:inline-block;flex:none}
.sec-wrap{margin-top:60px}
h3.mod{font-family:var(--fd);font-weight:600;font-size:17px;margin:34px 0 12px;color:var(--tx)}
h4.sub{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin:20px 0 6px}
h5.item{font-family:var(--fb);font-weight:700;font-size:14.5px;margin:16px 0 4px;color:var(--tx)}
p.b{margin:0 0 10px;color:var(--tx);white-space:pre-wrap}
blockquote{border-left:3px solid var(--ac);margin:18px 0;padding:14px 18px;background:var(--ac2);border-radius:0 10px 10px 0;color:var(--tx);font-style:normal;transition:background .2s,border-color .2s}
blockquote:hover{background:rgba(203,255,46,.16)}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:14px 0 22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;transition:transform .18s,border-color .18s,background .18s}
.stat:hover{transform:translateY(-2px);border-color:var(--acline);background:var(--panel2)}
.stat b{display:block;color:var(--tx3);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.stat span{font-size:14.5px;color:var(--tx);font-weight:600}

.srcs{margin-top:8px}
.edit[contenteditable="true"]{outline:1px dashed var(--acline);border-radius:4px;padding:1px 3px;cursor:text}
.edit[contenteditable="true"]:focus{outline:2px solid var(--ac);background:rgba(203,255,46,.06)}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.visible{opacity:1;transform:none}

.bar{position:fixed;right:18px;bottom:18px;z-index:5;display:flex;gap:8px;align-items:center}
.btn{font:600 13px var(--fb);background:var(--panel2);color:var(--tx);border:1px solid var(--line2);padding:9px 16px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.btn.pri{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.btn:disabled{opacity:.5;cursor:default}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:24px;width:min(420px,92vw)}
.modal h3{margin:0 0 12px;font-family:var(--fd);font-size:15px}
.modal input{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;color:var(--tx);padding:9px 12px;font:14px var(--fb);margin-bottom:12px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:11px 18px;border-radius:14px;z-index:30;box-shadow:0 12px 32px rgba(0,0,0,.5);font-size:13.5px}
.toast.err{background:#2a1211;border-color:rgba(255,122,112,.35);color:#ff7a70}
.center{max-width:520px;margin:120px auto;text-align:center;padding:0 20px;position:relative;z-index:1}
.center h1{font-family:var(--fd);font-size:22px;margin-bottom:8px}
.editbadge{position:fixed;top:14px;right:14px;background:var(--ac);color:var(--acink);font:700 11px var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;z-index:5}

.herostats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.herostat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px 9px}
.herostat b{font-family:var(--fd);font-size:20px;color:var(--ac);display:block;line-height:1.1}
.herostat span{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}

.modtitle{font-family:var(--fd);font-weight:700;font-size:19px;margin:42px 0 2px;color:var(--tx)}
.sec-wrap+.modtitle,.modtitle:first-of-type{margin-top:10px}

.itemgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:14px 0 24px}
.itemcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;transition:border-color .18s,transform .18s,background .18s}
.itemcard:hover{border-color:var(--acline);transform:translateY(-2px);background:var(--panel2)}
.itemcard.accent{border-left:3px solid var(--ac)}
.itemcard .ibadge{display:inline-block;font-size:13px;margin-bottom:6px}
.itemcard h5{margin:0 0 10px;font-family:var(--fd);font-weight:600;font-size:15px;color:var(--tx)}
.itemcard .ifield{margin:0 0 9px;font-size:13px}
.itemcard .ifield:last-child{margin-bottom:0}
.itemcard .ifield b{display:block;color:var(--tx3);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.itemcard .ifield span{color:var(--tx)}
.itemcard .reflink{display:inline-block;margin-top:8px;font-size:11px;color:var(--ac);background:var(--ac2);padding:3px 10px;border-radius:999px}

.segtabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.segtab{background:var(--panel2);border:1px solid var(--line2);color:var(--tx2);font:600 12.5px var(--fb);padding:8px 14px;border-radius:999px;cursor:pointer}
.segtab:hover{color:var(--tx)}
.segtab.active{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.segpanel{display:none}
.segpanel.active{display:block}
.segpanel h5{font-family:var(--fd);font-weight:600;font-size:16px;margin:0 0 12px}

.funnel{display:flex;flex-wrap:wrap;gap:22px;margin:14px 0 24px}
.funnel .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;flex:1;min-width:210px;position:relative}
.funnel .stage:not(:first-child):before{content:'→';position:absolute;left:-19px;top:50%;transform:translateY(-50%);color:var(--ac);font-weight:700;font-size:16px}
.funnel .stagelabel{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-bottom:5px}
.funnel .stage h5{margin:0 0 9px;font-family:var(--fd);font-weight:600;font-size:15px}
.funnel .stage .f{font-size:12.5px;color:var(--tx2);margin:4px 0}
.funnel .stage .f b{color:var(--tx3);font-weight:600}

.srclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:14px 0}
.srccard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:12.5px}
.srccard a{color:var(--ac);text-decoration:none;font-weight:600}
.srccard a:hover{text-decoration:underline}
.srccard .note{color:var(--tx2);margin-top:4px}

@media (max-width:960px){
  .page{display:block}
  .toc{position:sticky;top:0;height:auto;width:100%;padding:0;background:rgba(11,11,12,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}
  .toc-inner{flex-direction:row;overflow-x:auto;gap:4px;padding:12px 16px;-webkit-overflow-scrolling:touch}
  .toc-brand{display:none}
  .toc a{white-space:nowrap;border-left:none;border-bottom:2px solid transparent}
  .toc a.active{border-left-color:transparent;border-bottom-color:var(--ac)}
  .toc-progress{display:none}
  .wrap{padding:28px 18px 120px}
  .funnel{flex-direction:column}
  .funnel .stage:not(:first-child):before{content:'↓';left:50%;top:-19px;transform:translateX(-50%)}
}
@media print{.bar,.editbadge,.toc,.progress{display:none!important}.blob{display:none}.page{display:block}.wrap{max-width:none}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="blob b1" id="blob1"></div><div class="blob b2" id="blob2"></div>
<div id="root"><div class="center"><h1>Завантаження…</h1></div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token = location.pathname.replace(/^\/s\//, '').replace(/\/+$/, '');
const ls = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };
let DATA = null, EDIT = false, DIRTY = false;

function toast(t, err) { const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), err ? 6000 : 3000); }

async function api(path, opt) {
  opt = opt || {};
  const h = { 'content-type': 'application/json' };
  const k = ls.get('aso_key'); if (k) h['x-team-key'] = k;
  const r = await fetch('/api' + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return j;
}

function slug(i) { return 'sec-' + i; }

function readTime(blocks) {
  const words = blocks.map(b => (b.x || b.v || b.k || '')).join(' ').trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words / 180));
}

function kvCard(b, i) {
  const ed = EDIT ? ` contenteditable="true" class="edit" data-idx="${i}" data-field="v"` : '';
  return `<div class="stat"><b>${esc(b.k)}</b><span${ed}>${esc(b.v || '')}</span></div>`;
}

function blockHtml(b, i) {
  const ed = c => EDIT ? ` contenteditable="true" class="edit" data-idx="${i}"${c ? ' data-field="' + c + '"' : ''}` : '';
  if (b.t === 'h1') return `<div class="hero"><div class="brand"><i></i>BESSARAB M.A.</div><h1${ed()}>${esc(b.x)}</h1></div>`;
  if (b.t === 'meta') return `<div class="meta"${ed()}>${esc(b.x)}</div>`;
  if (b.t === 'h2') return `<div class="sec-wrap reveal"><h2 class="sec" id="${slug(i)}"><i></i><span${ed()}>${esc(b.x)}</span></h2></div>`;
  if (b.t === 'h3') return `<h3 class="mod reveal"${ed()}>${esc(b.x)}</h3>`;
  if (b.t === 'h4') return `<h4 class="sub reveal"${ed()}>${esc(b.x)}</h4>`;
  if (b.t === 'h5') return `<h5 class="item reveal"${ed()}>${esc(b.x)}</h5>`;
  if (b.t === 'p') return `<p class="b reveal"${ed()}>${esc(b.x)}</p>`;
  if (b.t === 'quote') return `<blockquote class="reveal"${ed()}>${esc(b.x)}</blockquote>`;
  return '';
}

function renderContent(blocks) {
  let html = '', i = 0, hero = '';
  if (blocks[0] && blocks[0].t === 'h1') { hero += blockHtml(blocks[0], 0); i = 1; if (blocks[1] && blocks[1].t === 'meta') { hero += blockHtml(blocks[1], 1); i = 2; } }
  let body = '';
  for (; i < blocks.length; i++) {
    const b = blocks[i];
    if (b.t === 'kv') {
      let group = [], j = i;
      while (j < blocks.length && blocks[j].t === 'kv') { group.push(kvCard(blocks[j], j)); j++; }
      body += `<div class="stats reveal">${group.join('')}</div>`;
      i = j - 1;
    } else {
      body += blockHtml(b, i);
    }
  }
  return hero + body;
}

function tocHtml(blocks) {
  const items = blocks.map((b, i) => b.t === 'h2' ? { i, x: b.x } : null).filter(Boolean);
  if (!items.length) return '';
  return `<nav class="toc"><div class="toc-inner">
    <div class="toc-brand"><i></i>Зміст</div>
    ${items.map(it => `<a href="#${slug(it.i)}" data-target="${slug(it.i)}">${esc(it.x)}</a>`).join('')}
    <div class="toc-progress">~${readTime(blocks)} хв читання</div>
  </div></nav>`;
}

function renderDoc() {
  const root = $('#root');
  root.innerHTML = `<div class="page">
      ${EDIT ? '' : tocHtml(DATA.blocks)}
      <div class="wrap">${renderContent(DATA.blocks)}</div>
    </div>
    ${EDIT ? '<div class="editbadge">Режим редагування</div>' : ''}
    <div class="bar no-print">
      ${EDIT ? `<button class="btn" id="cancelBtn">Скасувати</button><button class="btn pri" id="saveBtn" ${DIRTY ? '' : 'disabled'}>💾 Зберегти</button>` : `<button class="btn" id="editBtn">✎ Редагувати</button>`}
    </div>`;
  if (EDIT) {
    root.querySelectorAll('.edit').forEach(el => el.addEventListener('input', () => { DIRTY = true; const b = $('#saveBtn'); if (b) b.disabled = false; }));
    $('#saveBtn').onclick = saveEdits;
    $('#cancelBtn').onclick = () => { if (DIRTY && !confirm('Скасувати незбережені правки?')) return; EDIT = false; DIRTY = false; load(); };
  } else {
    $('#editBtn').onclick = enterEdit;
    root.querySelectorAll('.toc a').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      const t = document.getElementById(a.dataset.target);
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }
  revealCheck();
}

// позначає видимими всі .reveal-блоки, що вже потрапили у вʼюпорт — перевіряється і при
// рендері, і при кожному скролі, тому навіть швидкий/миттєвий скрол нічого не «губить»
// (на відміну від IntersectionObserver, який реагує лише на сам момент перетину межі)
function revealCheck() {
  const vh = window.innerHeight || document.documentElement.clientHeight;
  document.querySelectorAll('.reveal:not(.visible)').forEach(el => {
    if (el.getBoundingClientRect().top < vh * 0.94) el.classList.add('visible');
  });
}

function collectEdits() {
  document.querySelectorAll('.edit').forEach(el => {
    const i = +el.dataset.idx; const field = el.dataset.field;
    const val = el.innerText.replace(/\n+$/, '');
    if (field) DATA.blocks[i][field] = val; else DATA.blocks[i].x = val;
  });
}

async function saveEdits() {
  collectEdits();
  try { await api('/share/' + token, { method: 'PUT', body: { blocks: DATA.blocks } }); DIRTY = false; EDIT = false; toast('Збережено'); renderDoc(); }
  catch (e) { if (e.status === 401) { ls.set('aso_key', ''); toast('Невірний командний ключ — увійдіть ще раз', true); askKey().then(ok => { if (ok) saveEdits(); }); } else toast(e.message, true); }
}

function askKey() {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><h3>Редагування стратегії</h3><p style="color:var(--tx2);font-size:13px;margin:0 0 10px">Потрібен командний ключ команди BMA.</p><input type="text" id="keyInput" placeholder="Командний ключ" autofocus><div class="row"><button class="btn" id="keyCancel">Скасувати</button><button class="btn pri" id="keyOk">Увійти</button></div></div>`;
    document.body.appendChild(bg);
    $('#keyCancel').onclick = () => { bg.remove(); res(false); };
    $('#keyOk').onclick = () => { const v = $('#keyInput').value.trim(); if (!v) return; ls.set('aso_key', v); bg.remove(); res(true); };
  });
}

async function enterEdit() {
  if (!ls.get('aso_key')) { const ok = await askKey(); if (!ok) return; }
  EDIT = true; DIRTY = false; renderDoc();
}

/* =====================================================================
   МОДУЛЬНИЙ РЕНДЕРЕР (Strategy Website) — свіжі публікації несуть DATA.modules:
   groups[] → modules[] → sections[] (text/fields/list/refs), а не плаский
   список блоків. Кожен тип секції отримує свій UI-компонент (сегменти —
   вкладки, конкуренти/ризики/гіпотези — картки, етапи воронки — степпер),
   замість суцільного потоку тексту. Якщо modules відсутні (старе
   посилання, опубліковане до цього оновлення) — працює старий рендер
   нижче (renderDoc/blockHtml), повністю без змін.
   ===================================================================== */
const ICON = { insights: '💡', opportunities: '✦', commOpps: '✦', risks: '⚠', priorities: '◆', hypotheses: '🧪' };
let EDITMAP = [];
function edAttr(desc) { if (!EDIT) return ''; const idx = EDITMAP.length; EDITMAP.push(desc); return ` contenteditable="true" class="edit" data-eidx="${idx}"`; }

function wordCountModules(groups) {
  let n = 0; const add = s => { if (!s) return; n += String(s).trim().split(/\s+/).filter(Boolean).length; };
  groups.forEach(g => g.modules.forEach(m => {
    if (m.custom) { add(m.text); return; }
    (m.sections || []).forEach(s => { add(s.text); (s.fields || []).forEach(f => add(f.v)); (s.items || []).forEach(it => { add(it.title); (it.fields || []).forEach(f => add(f.v)); }); });
  }));
  return n;
}
const readTimeModules = groups => Math.max(1, Math.round(wordCountModules(groups) / 180));

function findSection(groups, modId, secKey) {
  for (const g of groups) for (const m of g.modules) if (m.id === modId) for (const s of (m.sections || [])) if (s.key === secKey) return s;
  return null;
}
function findSegmentTitle(groups, segId) {
  const s = findSection(groups, 'audience', 'segments'); if (!s || !s.items) return null;
  const it = s.items.find(x => x.id === segId); return it ? it.title : null;
}
function heroStats(groups) {
  const stats = [];
  const seg = findSection(groups, 'audience', 'segments'); if (seg && seg.items && seg.items.length) stats.push({ v: seg.items.length, l: 'сегментів ЦА' });
  const comp = findSection(groups, 'competitors', 'matrix'); if (comp && comp.items && comp.items.length) stats.push({ v: comp.items.length, l: 'конкурентів' });
  const ins = findSection(groups, 'insightsA', 'insights'); if (ins && ins.items && ins.items.length) stats.push({ v: ins.items.length, l: 'стратегічних висновків' });
  const hyp = findSection(groups, 'insightsA', 'hypotheses'); if (hyp && hyp.items && hyp.items.length) stats.push({ v: hyp.items.length, l: 'гіпотез до перевірки' });
  return stats.slice(0, 4);
}

function renderTextSec(gi, mi, si, sec) {
  let h = `<div class="reveal"><h4 class="sub">${esc(sec.title)}</h4><p class="b"${edAttr({ kind: 'sectext', gi, mi, si })}>${esc(sec.text || '')}</p>`;
  if (sec.implication) h += `<blockquote>Що це означає для стратегії? ${esc(sec.implication)}</blockquote>`;
  if (sec.hypotheses && sec.hypotheses.length) h += `<blockquote>Гіпотези (потребують перевірки): ${esc(sec.hypotheses.join(' | '))}</blockquote>`;
  return h + `</div>`;
}
function renderFieldsSec(gi, mi, si, sec) {
  const rows = sec.fields.map((f, fi) => f.v ? `<div class="stat"><b>${esc(f.l)}</b><span${edAttr({ kind: 'secfieldv', gi, mi, si, fi })}>${esc(f.v)}</span></div>` : '').join('');
  if (!rows) return '';
  let h = `<div class="reveal"><h4 class="sub">${esc(sec.title)}</h4><div class="stats">${rows}</div>`;
  if (sec.implication) h += `<blockquote>Що це означає для стратегії? ${esc(sec.implication)}</blockquote>`;
  return h + `</div>`;
}
function renderRefsSec(sec) {
  if (!sec.refs || !sec.refs.length) return '';
  const cards = sec.refs.map(r => `<div class="srccard">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>` : esc(r.title)}${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}</div>`).join('');
  return `<div class="reveal"><h4 class="sub">${esc(sec.title)}</h4><div class="srclist">${cards}</div></div>`;
}
function itemCardHtml(gi, mi, si, it, ii, groups, icon, accent) {
  let h = `<div class="itemcard${accent ? ' accent' : ''}">`;
  if (icon) h += `<span class="ibadge">${icon}</span>`;
  h += `<h5${edAttr({ kind: 'itemtitle', gi, mi, si, ii })}>${esc((it.id ? it.id + '. ' : '') + it.title)}</h5>`;
  (it.fields || []).forEach((f, fi) => { if (!f.v) return; h += `<div class="ifield"><b>${esc(f.l)}</b><span${edAttr({ kind: 'itemfieldv', gi, mi, si, ii, fi })}>${esc(f.v)}</span></div>`; });
  if (it.ref) { const t = findSegmentTitle(groups, it.ref); if (t) h += `<span class="reflink">↳ ${esc(t)}</span>`; }
  return h + `</div>`;
}
function renderItemGrid(gi, mi, si, sec, groups, icon, accent) {
  if (!sec.items || !sec.items.length) return '';
  let h = `<div class="reveal"><h4 class="sub">${esc(sec.title)}</h4><div class="itemgrid">${sec.items.map((it, ii) => itemCardHtml(gi, mi, si, it, ii, groups, icon, accent)).join('')}</div>`;
  if (sec.implication) h += `<blockquote>Що це означає для стратегії? ${esc(sec.implication)}</blockquote>`;
  return h + `</div>`;
}
function renderSegments(gi, mi, si, sec) {
  if (!sec.items || !sec.items.length) return '';
  const key = `${gi}-${mi}-${si}`;
  let h = `<div class="reveal"><h4 class="sub">${esc(sec.title)}</h4><div class="segtabs">`;
  h += sec.items.map((it, ii) => `<button type="button" class="segtab${ii === 0 ? ' active' : ''}" data-seg="${key}-${ii}">${esc((it.id ? it.id + ' · ' : '') + it.title)}</button>`).join('');
  h += `</div>`;
  h += sec.items.map((it, ii) => {
    const rows = (it.fields || []).map((f, fi) => f.v ? `<div class="stat"><b>${esc(f.l)}</b><span${edAttr({ kind: 'itemfieldv', gi, mi, si, ii, fi })}>${esc(f.v)}</span></div>` : '').join('');
    return `<div class="segpanel${ii === 0 ? ' active' : ''}" data-segpanel="${key}-${ii}"><h5${edAttr({ kind: 'itemtitle', gi, mi, si, ii })}>${esc(it.title)}</h5><div class="itemgrid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${rows}</div></div>`;
  }).join('');
  if (sec.implication) h += `<blockquote>Що це означає для стратегії? ${esc(sec.implication)}</blockquote>`;
  return h + `</div>`;
}
function renderFunnel(gi, mi, si, sec) {
  if (!sec.items || !sec.items.length) return '';
  const stages = sec.items.map((it, ii) => {
    const stageF = (it.fields || []).find(f => f.k === 'stage');
    const rest = (it.fields || []).filter(f => f.k !== 'stage');
    const label = (stageF && stageF.v) || it.title || ('Етап ' + (ii + 1));
    let c = `<div class="stage"><div class="stagelabel">${esc(label)}</div>`;
    c += `<h5${edAttr({ kind: 'itemtitle', gi, mi, si, ii })}>${esc(it.title || label)}</h5>`;
    rest.forEach(f => { if (!f.v) return; const fi = it.fields.indexOf(f); c += `<div class="f"><b>${esc(f.l)}:</b> <span${edAttr({ kind: 'itemfieldv', gi, mi, si, ii, fi })}>${esc(f.v)}</span></div>`; });
    return c + `</div>`;
  }).join('');
  return `<div class="reveal"><h4 class="sub">${esc(sec.title)}</h4><div class="funnel">${stages}</div></div>`;
}
function renderSection(gi, mi, si, sec, groups, modId) {
  if (sec.kind === 'text') return renderTextSec(gi, mi, si, sec);
  if (sec.kind === 'fields') return renderFieldsSec(gi, mi, si, sec);
  if (sec.kind === 'refs') return renderRefsSec(sec);
  if (sec.kind === 'list') {
    if (modId === 'audience' && sec.key === 'segments') return renderSegments(gi, mi, si, sec);
    if (sec.isFunnel) return renderFunnel(gi, mi, si, sec);
    return renderItemGrid(gi, mi, si, sec, groups, ICON[sec.key], sec.key === 'insights');
  }
  return '';
}
function renderModule(gi, mi, mod, groups) {
  let h = `<div class="modtitle reveal">${esc(mod.title)}</div>`;
  if (mod.custom) return h + `<div class="reveal"><p class="b"${edAttr({ kind: 'modtext', gi, mi })}>${esc(mod.text || '')}</p></div>`;
  (mod.sections || []).forEach((sec, si) => { h += renderSection(gi, mi, si, sec, groups, mod.id); });
  return h;
}
function renderGroup(gi, g, groups) {
  let h = `<div class="sec-wrap reveal"><h2 class="sec" id="sec-${gi}"><i></i><span>${esc(g.label)}</span></h2></div>`;
  g.modules.forEach((mod, mi) => { h += renderModule(gi, mi, mod, groups); });
  return h;
}
function renderSourcesSection(sources, gi) {
  if (!sources || !sources.length) return '';
  const cards = sources.map(s => `<div class="srccard"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>${s.date ? ' · ' + esc(s.date) : ''}${s.evidence ? `<div class="note">${esc(s.evidence)}</div>` : ''}</div>`).join('');
  return `<div class="sec-wrap reveal"><h2 class="sec" id="sec-${gi}"><i></i><span>Джерела</span></h2></div><div class="reveal"><div class="srclist">${cards}</div></div>`;
}
function renderHeroModules() {
  const groups = DATA.modules;
  let h = `<div class="hero"><div class="brand"><i></i>BESSARAB M.A.</div><h1>Стратегія: <span${edAttr({ kind: 'name' })}>${esc(DATA.name)}</span></h1>`;
  if (DATA.meta) h += `<div class="meta"${edAttr({ kind: 'meta' })}>${esc(DATA.meta)}</div>`;
  const hs = heroStats(groups);
  if (hs.length) h += `<div class="herostats">${hs.map(s => `<div class="herostat"><b>${s.v}</b><span>${esc(s.l)}</span></div>`).join('')}</div>`;
  h += `<div class="readtime"><i></i>~${readTimeModules(groups)} хв читання</div></div>`;
  return h;
}

function renderModulesDoc() {
  EDITMAP = [];
  const groups = DATA.modules;
  let body = ''; groups.forEach((g, gi) => { body += renderGroup(gi, g, groups); });
  const srcGi = groups.length;
  body += renderSourcesSection(DATA.sources, srcGi);
  const tocItems = groups.map((g, gi) => ({ i: gi, x: g.label }));
  if (DATA.sources && DATA.sources.length) tocItems.push({ i: srcGi, x: 'Джерела' });
  const toc = (!EDIT && tocItems.length) ? `<nav class="toc"><div class="toc-inner"><div class="toc-brand"><i></i>Зміст</div>${tocItems.map(it => `<a href="#sec-${it.i}" data-target="sec-${it.i}">${esc(it.x)}</a>`).join('')}<div class="toc-progress">~${readTimeModules(groups)} хв читання</div></div></nav>` : '';
  const root = $('#root');
  root.innerHTML = `<div class="page">${toc}<div class="wrap">${renderHeroModules()}${body}</div></div>
    ${EDIT ? '<div class="editbadge">Режим редагування</div>' : ''}
    <div class="bar no-print">
      ${EDIT ? `<button class="btn" id="cancelBtn">Скасувати</button><button class="btn pri" id="saveBtn" ${DIRTY ? '' : 'disabled'}>💾 Зберегти</button>` : `<button class="btn" id="editBtn">✎ Редагувати</button>`}
    </div>`;
  if (EDIT) {
    root.querySelectorAll('.edit').forEach(el => el.addEventListener('input', () => { DIRTY = true; const b = $('#saveBtn'); if (b) b.disabled = false; }));
    $('#saveBtn').onclick = saveEditsModules;
    $('#cancelBtn').onclick = () => { if (DIRTY && !confirm('Скасувати незбережені правки?')) return; EDIT = false; DIRTY = false; load(); };
  } else {
    $('#editBtn').onclick = enterEditModules;
    root.querySelectorAll('.toc a').forEach(a => a.addEventListener('click', e => {
      e.preventDefault(); const t = document.getElementById(a.dataset.target); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }
  root.querySelectorAll('.segtab').forEach(btn => btn.addEventListener('click', () => {
    const key = btn.dataset.seg; const scope = btn.closest('.reveal') || root;
    scope.querySelectorAll('.segtab').forEach(b => b.classList.toggle('active', b === btn));
    scope.querySelectorAll('.segpanel').forEach(p => p.classList.toggle('active', p.dataset.segpanel === key));
  }));
  revealCheck();
}

function collectEditsModules() {
  document.querySelectorAll('.edit').forEach(el => {
    const d = EDITMAP[+el.dataset.eidx]; if (!d) return;
    const val = el.innerText.replace(/\n+$/, '');
    if (d.kind === 'name') { DATA.name = val; return; }
    if (d.kind === 'meta') { DATA.meta = val; return; }
    const mod = DATA.modules[d.gi].modules[d.mi];
    if (d.kind === 'modtext') mod.text = val;
    else if (d.kind === 'sectext') mod.sections[d.si].text = val;
    else if (d.kind === 'secfieldv') mod.sections[d.si].fields[d.fi].v = val;
    else if (d.kind === 'itemtitle') mod.sections[d.si].items[d.ii].title = val;
    else if (d.kind === 'itemfieldv') mod.sections[d.si].items[d.ii].fields[d.fi].v = val;
  });
}
async function saveEditsModules() {
  collectEditsModules();
  try {
    await api('/share/' + token, { method: 'PUT', body: { modules: DATA.modules, name: DATA.name, meta: DATA.meta } });
    DIRTY = false; EDIT = false; toast('Збережено'); renderModulesDoc();
  } catch (e) { if (e.status === 401) { ls.set('aso_key', ''); toast('Невірний командний ключ — увійдіть ще раз', true); askKey().then(ok => { if (ok) saveEditsModules(); }); } else toast(e.message, true); }
}
async function enterEditModules() {
  if (!ls.get('aso_key')) { const ok = await askKey(); if (!ok) return; }
  EDIT = true; DIRTY = false; renderModulesDoc();
}

async function load() {
  try {
    DATA = await api('/share/' + token);
    document.title = DATA.name || 'Стратегія';
    if (DATA.modules && DATA.modules.length) renderModulesDoc(); else renderDoc();
  } catch (e) {
    $('#root').innerHTML = `<div class="center"><h1>Сторінку не знайдено</h1><p style="color:var(--tx2)">Посилання застаріло або стратегію знято з публікації.</p></div>`;
  }
}
load();

// прогрес-бар читання + підсвітка активного пункту меню (глобально, не залежить від рендеру)
let ticking = false;
function onScroll() {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const h = document.documentElement;
    const scrolled = h.scrollTop || document.body.scrollTop;
    const max = (h.scrollHeight || document.body.scrollHeight) - h.clientHeight;
    const pct = max > 0 ? Math.min(100, (scrolled / max) * 100) : 0;
    const pb = $('#progress'); if (pb) pb.style.width = pct + '%';
    const secs = document.querySelectorAll('h2.sec[id]');
    if (secs.length) {
      let current = null;
      secs.forEach(s => { if (s.getBoundingClientRect().top < 140) current = s.id; });
      document.querySelectorAll('.toc a').forEach(a => a.classList.toggle('active', a.dataset.target === current));
    }
    revealCheck();
    ticking = false;
  });
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', () => requestAnimationFrame(revealCheck), { passive: true });
</script>
</body>
</html>
