<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стратегія</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--panel:#141416;--panel2:#1a1a1c;--line:rgba(244,243,238,.13);--line2:rgba(244,243,238,.24);--tx:#f4f3ee;--tx2:#a5a49d;--tx3:#6c6b66;
--ac:#cbff2e;--ac2:rgba(203,255,46,.10);--acink:#0c1300;--acline:rgba(203,255,46,.38);
--r:18px;--fd:'Unbounded','Manrope',sans-serif;--fb:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{font:15px/1.65 var(--fb);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
.blob{position:fixed;width:52vw;height:52vw;max-width:760px;max-height:760px;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none;z-index:0}
.blob.b1{background:var(--ac);top:-18vw;left:-16vw}
.blob.b2{background:var(--ac);bottom:-20vw;right:-18vw}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--ac);z-index:50;width:0%;box-shadow:0 0 12px var(--ac);transition:width .08s linear}

/* ===================== LEGACY (стара плоска версія посилань) ===================== */
.page{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,860px);gap:0;justify-content:center}
.toc{position:sticky;top:0;align-self:start;height:100vh;padding:38px 14px 40px 28px;overflow-y:auto;scrollbar-width:thin}
.toc-inner{display:flex;flex-direction:column;gap:2px}
.toc-brand{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin:0 0 16px;display:flex;align-items:center;gap:8px}
.toc-brand i{width:8px;height:8px;border-radius:2px;background:var(--ac);display:inline-block;flex:none}
.toc a{color:var(--tx3);text-decoration:none;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:9px;border-left:2px solid transparent;transition:color .15s,background .15s,border-color .15s;line-height:1.35}
.toc a:hover{color:var(--tx);background:var(--panel2)}
.toc a.active{color:var(--ac);background:transparent;border-left-color:var(--ac)}
.toc-progress{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);color:var(--tx3);font-size:11px;letter-spacing:.04em}

.wrap{padding:64px 24px 140px;min-width:0}
.hero{padding:40px 0 26px;border-bottom:1px solid var(--line)}
.hero .brand{font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.hero .brand i{width:10px;height:10px;border-radius:3px;background:var(--ac);display:inline-block}
.hero h1{font-family:var(--fd);font-weight:800;font-size:clamp(28px,5vw,46px);line-height:1.08;margin:0 0 14px;text-transform:uppercase;letter-spacing:-.01em}
.hero .meta{color:var(--tx2);font-size:13.5px}
.hero .readtime{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.hero .readtime i{width:6px;height:6px;border-radius:50%;background:var(--ac);display:inline-block}

h2.sec{font-family:var(--fd);font-weight:800;font-size:clamp(20px,3.4vw,30px);text-transform:uppercase;letter-spacing:-.005em;margin:0 0 4px;padding-top:28px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;scroll-margin-top:24px}
h2.sec i{width:22px;height:4px;background:var(--ac);border-radius:3px;display:inline-block;flex:none}
.sec-wrap{margin-top:60px}
h3.mod{font-family:var(--fd);font-weight:600;font-size:17px;margin:34px 0 12px;color:var(--tx)}
h4.sub{font-family:var(--fd);font-size:13.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tx);margin:38px 0 14px;padding-left:15px;position:relative;display:flex;align-items:center;min-height:16px}
h4.sub:before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:15px;background:var(--ac);border-radius:2px}
h4.sub:first-child{margin-top:4px}
h5.item{font-family:var(--fb);font-weight:700;font-size:14.5px;margin:16px 0 4px;color:var(--tx)}
p.b{margin:0 0 10px;color:var(--tx);white-space:pre-wrap}
blockquote{border-left:3px solid var(--ac);margin:18px 0;padding:14px 18px;background:var(--ac2);border-radius:0 10px 10px 0;color:var(--tx);font-style:normal;transition:background .2s,border-color .2s}
blockquote:hover{background:rgba(203,255,46,.16)}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:14px 0 22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;transition:transform .18s,border-color .18s,background .18s}
.stat:hover{transform:translateY(-2px);border-color:var(--acline);background:var(--panel2)}
.stat b{display:block;color:var(--tx3);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.stat span{font-size:14.5px;color:var(--tx);font-weight:600}

.srcs{margin-top:8px}
.edit[contenteditable="true"]{outline:1px dashed var(--acline);border-radius:4px;padding:1px 3px;cursor:text}
.edit[contenteditable="true"]:focus{outline:2px solid var(--ac);background:rgba(203,255,46,.06)}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.visible{opacity:1;transform:none}

.bar{position:fixed;right:18px;bottom:18px;z-index:46;display:flex;gap:8px;align-items:center}
.btn{font:600 13px var(--fb);background:var(--panel2);color:var(--tx);border:1px solid var(--line2);padding:9px 16px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.btn.pri{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.btn:disabled{opacity:.5;cursor:default}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:70}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:24px;width:min(420px,92vw)}
.modal h3{margin:0 0 12px;font-family:var(--fd);font-size:15px}
.modal input{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;color:var(--tx);padding:9px 12px;font:14px var(--fb);margin-bottom:12px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:11px 18px;border-radius:14px;z-index:71;box-shadow:0 12px 32px rgba(0,0,0,.5);font-size:13.5px}
.toast.err{background:#2a1211;border-color:rgba(255,122,112,.35);color:#ff7a70}
.center{max-width:520px;margin:120px auto;text-align:center;padding:0 20px;position:relative;z-index:1}
.center h1{font-family:var(--fd);font-size:22px;margin-bottom:8px}
.editbadge{position:fixed;top:14px;right:14px;background:var(--ac);color:var(--acink);font:700 11px var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;z-index:46}

.herostats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.herostat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px 9px}
.herostat b{font-family:var(--fd);font-size:20px;color:var(--ac);display:block;line-height:1.1}
.herostat span{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}

.srclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:14px 0}
.srccard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:12.5px}
.srccard a{color:var(--ac);text-decoration:none;font-weight:600}
.srccard a:hover{text-decoration:underline}
.srccard .note{color:var(--tx2);margin-top:4px}

@media (max-width:960px){
  .page{display:block}
  .toc{position:sticky;top:0;height:auto;width:100%;padding:0;background:rgba(11,11,12,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}
  .toc-inner{flex-direction:row;overflow-x:auto;gap:4px;padding:12px 16px;-webkit-overflow-scrolling:touch}
  .toc-brand{display:none}
  .toc a{white-space:nowrap;border-left:none;border-bottom:2px solid transparent}
  .toc a.active{border-left-color:transparent;border-bottom-color:var(--ac)}
  .toc-progress{display:none}
  .wrap{padding:28px 18px 120px}
}
@media print{.bar,.editbadge,.toc,.progress{display:none!important}.blob{display:none}.page{display:block}.wrap{max-width:none}}

/* ===================== V2 PRESENTATION ENGINE (Strategy Website) =====================
   Кожен macro-розділ (group) має власне візуальне середовище (env-dark/env-light/env-accent
   — перемикає весь набір CSS-змінних, тож усі вкладені компоненти перефарбовуються
   автоматично) і власну геометрію сторінки на рівні секції (frame-narrow/-wide/-split/-canvas/
   fullbleed), а не один суцільний контент-стовпець. Sidebar як суцільний фон прибрано —
   навігація плаваюча (floatnav/dotrail/navoverlay). CARD — лише для дійсно дискретних сутностей
   (конкуренти, ризики, інсайти, етапи); для journey/funnel/map/ecosystem — окремі діаграми. */
.env-dark{--bg:#0b0b0c;--panel:#141416;--panel2:#1a1a1c;--line:rgba(244,243,238,.13);--line2:rgba(244,243,238,.24);--tx:#f4f3ee;--tx2:#a5a49d;--tx3:#6c6b66;--ac:#cbff2e;--ac2:rgba(203,255,46,.10);--acink:#0c1300;--acline:rgba(203,255,46,.38);background:var(--bg);color:var(--tx)}
.env-light{--bg:#f4f3ee;--panel:#e8e6dc;--panel2:#dcd9cc;--line:rgba(21,21,15,.12);--line2:rgba(21,21,15,.22);--tx:#15150f;--tx2:#55544a;--tx3:#847f6e;--ac:#5c7a00;--ac2:rgba(92,122,0,.1);--acink:#f4f3ee;--acline:rgba(92,122,0,.38);background:var(--bg);color:var(--tx)}
.env-accent{--bg:#cbff2e;--panel:#bdf01a;--panel2:#b0e40d;--line:rgba(12,19,0,.15);--line2:rgba(12,19,0,.26);--tx:#0c1300;--tx2:#28330a;--tx3:#4a5618;--ac:#0c1300;--ac2:rgba(12,19,0,.08);--acink:#cbff2e;--acline:rgba(12,19,0,.3);background:var(--bg);color:var(--tx)}
.fullbleed{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw}

.t-eyebrow{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.t-chapter{font-family:var(--fd);font-weight:800;font-size:clamp(32px,6vw,80px);line-height:1.0;text-transform:uppercase;margin:0}
.t-display{font-family:var(--fd);font-weight:800;font-size:clamp(30px,5.6vw,54px);line-height:1.06;text-transform:uppercase;letter-spacing:-.01em;margin:0}

.floatnav{position:fixed;top:18px;left:18px;z-index:45}
.floatnav-pill{display:flex;align-items:center;gap:9px;background:rgba(9,9,10,.6);backdrop-filter:blur(10px);border:1px solid rgba(244,243,238,.18);border-radius:999px;padding:7px 16px 7px 7px;cursor:pointer}
.floatnav-pill .nn{background:#cbff2e;color:#0c1300;font:800 10.5px var(--fd);padding:4px 9px;border-radius:999px;letter-spacing:.02em}
.floatnav-pill .nl{text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;color:#f4f3ee;opacity:.9;font-weight:700;font-family:var(--fb)}
.dotrail{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:45;display:flex;flex-direction:column;gap:9px}
.dotrail button{width:7px;height:7px;padding:0;border-radius:50%;border:none;background:rgba(150,150,140,.45);cursor:pointer}
.dotrail button.active{background:#cbff2e;width:9px;height:9px}
.navoverlay{position:fixed;inset:0;background:rgba(7,7,8,.95);backdrop-filter:blur(8px);z-index:60;display:none;align-items:center;justify-content:center;padding:40px 20px}
.navoverlay.open{display:flex}
.navoverlay .nlist{display:flex;flex-direction:column;gap:4px;text-align:center;max-height:86vh;overflow:auto}
.navoverlay a{font-family:var(--fd);font-weight:700;font-size:clamp(18px,3.6vw,32px);color:#716f66;text-decoration:none;padding:5px 0;text-transform:uppercase;letter-spacing:-.005em}
.navoverlay a:hover,.navoverlay a.active{color:#cbff2e}
.navoverlay .nclose{position:absolute;top:20px;right:22px;background:none;border:none;color:#f4f3ee;font-size:26px;cursor:pointer;line-height:1}
@media (max-width:720px){.dotrail{display:none}.floatnav{top:12px;left:12px}.floatnav-pill .nl{display:none}}

.mhero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;padding:0 24px;position:relative;max-width:1040px;margin:0 auto}
.mhero-brand{display:flex;align-items:center;gap:8px;margin-bottom:26px}
.mhero-brand i{width:9px;height:9px;border-radius:3px;background:var(--ac);display:inline-block}
.mhero-brand span{font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.mhero h1{max-width:960px}
.mhero .meta{color:var(--tx2);font-size:14px;margin-top:18px;max-width:680px}
.mhero-nums{display:flex;flex-wrap:wrap;gap:0;margin-top:46px}
.mhero-num{padding-right:28px;margin-right:28px;border-right:1px solid var(--line)}
.mhero-num:last-child{border-right:none;margin-right:0}
.mhero-num b{font-family:var(--fd);font-weight:800;font-size:clamp(30px,4.4vw,52px);color:var(--ac);line-height:1;display:block}
.mhero-num span{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.mhero-scroll{position:absolute;bottom:26px;left:0;font-size:10.5px;color:var(--tx3);display:flex;align-items:center;gap:9px;letter-spacing:.07em;text-transform:uppercase}
.mhero-scroll i{width:1px;height:22px;background:var(--tx3);display:inline-block;animation:scrolldown 1.8s infinite}
@keyframes scrolldown{0%{opacity:.15;transform:translateY(0)}50%{opacity:1}100%{opacity:.15;transform:translateY(7px)}}
@media (max-width:720px){.mhero{min-height:0;padding:40px 18px 60px}.mhero-scroll{display:none}}

.mchapter-env{position:relative}
.mchapter{min-height:86vh;display:flex;flex-direction:column;justify-content:center;padding:70px 24px;max-width:1040px;margin:0 auto;position:relative;scroll-margin-top:10px}
.mchapter .mnum{font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin-bottom:22px;display:flex;align-items:center;gap:10px}
.mchapter .mnum i{width:30px;height:2px;background:var(--ac);display:inline-block;opacity:.7}
.mchapter .mtitle{max-width:960px;margin:0 0 20px}
.mchapter .mtag{font-size:16px;color:var(--tx2);max-width:560px;line-height:1.55}
@media (max-width:720px){.mchapter{min-height:60vh;padding:48px 18px}}

.frame-narrow{max-width:700px;margin:0 auto;padding:60px 24px}
.frame-wide{max-width:1040px;margin:0 auto;padding:60px 24px}
.frame-split{max-width:1180px;margin:0 auto;padding:70px 24px;display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
.frame-canvas{max-width:1180px;margin:0 auto;padding:60px 24px}
@media (max-width:860px){.frame-split{grid-template-columns:1fr;gap:30px}.frame-narrow,.frame-wide,.frame-canvas{padding:40px 18px}}

.m-modtitle{font-family:var(--fd);font-weight:700;font-size:13px;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em;margin:0}
.m-subtitle{font-family:var(--fd);font-weight:800;font-size:clamp(19px,2.4vw,28px);margin:0 0 20px;letter-spacing:-.005em}

.story{min-height:52vh;display:flex;flex-direction:column;justify-content:center}
.story .headline{font-family:var(--fd);font-weight:800;font-size:clamp(26px,4.6vw,52px);line-height:1.1;max-width:880px;margin:0}
.story .sub{font-size:16px;color:var(--tx2);max-width:620px;line-height:1.7;margin:0}

.manifesto .bigstatement{font-family:var(--fd);font-weight:800;font-size:clamp(25px,4.2vw,44px);line-height:1.18;margin:0 0 50px;max-width:820px}
.triad{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:34px;margin:10px 0 50px;padding-top:24px;border-top:1px solid var(--line)}
.triad b{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
.triad span{font-size:15px;color:var(--tx);line-height:1.5}
.proseblock{max-width:680px}
.proseblock p{font-size:15px;line-height:1.8;color:var(--tx2);margin:0 0 16px}
.proseblock p:last-child{margin-bottom:0}
.proseblock b{color:var(--tx3)}

.ideawrap{padding:60px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:76vh;max-width:1040px;margin:0 auto}
.ideawrap .t-eyebrow{margin-bottom:22px}
.ideawrap .ideastatement{font-family:var(--fd);font-weight:800;font-size:clamp(28px,5.4vw,62px);line-height:1.14;max-width:880px;margin:0 0 20px}
.ideawrap .ideasub{font-size:15px;color:var(--tx2);max-width:560px}

.splitpair{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin:18px 0 8px;padding-top:20px;border-top:1px solid var(--line)}
.splitcol .splitlabel{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px}
.splitcol.pos .splitlabel{color:var(--ac)}
.splitcol.neg .splitlabel{color:#ff8a7e}
.env-light .splitcol.neg .splitlabel,.env-accent .splitcol.neg .splitlabel{color:#b23f2f}
.splitbody div{font-size:13.5px;color:var(--tx);padding:6px 0;line-height:1.55}
@media (max-width:640px){.splitpair{grid-template-columns:1fr;gap:18px}}

.fieldstrip{display:flex;flex-wrap:wrap;gap:0;margin:10px 0 18px;border-top:1px solid var(--line)}
.fitem{flex:1 1 180px;padding:13px 20px 13px 0;border-bottom:1px solid var(--line)}
.fitem b{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:5px}
.fitem span{font-size:13.5px;color:var(--tx)}

.bignum{margin:14px 0 8px}
.bignum .bnval{font-family:var(--fd);font-weight:800;font-size:clamp(34px,6.4vw,64px);color:var(--ac);line-height:1}
.bignum .bnlabel{font-size:12px;color:var(--tx2);margin-top:6px;max-width:440px;text-transform:uppercase;letter-spacing:.04em}

.sowhat{margin:18px 0 6px;padding:14px 0 0;border-top:1px solid var(--line)}
.sowhat-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);margin-bottom:7px}
.sowhat-text{font-size:14.5px;color:var(--tx);line-height:1.6;max-width:640px}

.jtbd{margin:2px 0 44px;max-width:760px}
.jtbd b{display:block;color:var(--ac);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;font-family:var(--fb);font-weight:800}
.jtbd span{font-family:var(--fd);font-weight:700;font-size:clamp(19px,2.6vw,27px);line-height:1.35;display:block}

.segswitch{display:flex;align-items:center;gap:16px;margin:0 0 18px}
.segswitch button{background:none;border:1px solid var(--line2);width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--tx);font:700 15px var(--fb)}
.seglabel{font-family:var(--fd);font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--tx3);min-width:64px;text-align:center}
.segpanel2{display:none}
.segpanel2.active{display:block;animation:segfade .35s ease}
@keyframes segfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hjourney{position:relative;margin:4px 0 0}
.hjourney-line{position:relative;display:flex;justify-content:space-between;padding:0 2px}
.hjourney-line:before{content:'';position:absolute;left:0;right:0;top:9px;height:2px;background:var(--line2);z-index:0}

.hjourney-dot{width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);transition:all .15s;display:block}

<body>
<div class="progress" id="progress"></div>
<div class="blob b1" id="blob1"></div><div class="blob b2" id="blob2"></div>
<div id="root"><div class="center"><h1>Завантаження…</h1></div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token = location.pathname.replace(/^\/s\//, '').replace(/\/+$/, '');
const ls = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };
let DATA = null, EDIT = false, DIRTY = false;

function toast(t, err) { const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), err ? 6000 : 3000); }

async function api(path, opt) {
  opt = opt || {};
  const h = { 'content-type': 'application/json' };
  const k = ls.get('aso_key'); if (k) h['x-team-key'] = k;
  const r = await fetch('/api' + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return j;
}

function slug(i) { return 'sec-' + i; }
const pad2 = n => String(n).padStart(2, '0');

function readTime(blocks) {
  const words = blocks.map(b => (b.x || b.v || b.k || '')).join(' ').trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words / 180));
}

function kvCard(b, i) {
  const ed = EDIT ? ` contenteditable="true" class="edit" data-idx="${i}" data-field="v"` : '';
  return `<div class="stat"><b>${esc(b.k)}</b><span${ed}>${esc(b.v || '')}</span></div>`;
}

function blockHtml(b, i) {
  const ed = c => EDIT ? ` contenteditable="true" class="edit" data-idx="${i}"${c ? ' data-field="' + c + '"' : ''}` : '';
  if (b.t === 'h1') return `<div class="hero"><div class="brand"><i></i>BESSARAB M.A.</div><h1${ed()}>${esc(b.x)}</h1></div>`;
  if (b.t === 'meta') return `<div class="meta"${ed()}>${esc(b.x)}</div>`;
  if (b.t === 'h2') return `<div class="sec-wrap reveal"><h2 class="sec" id="${slug(i)}"><i></i><span${ed()}>${esc(b.x)}</span></h2></div>`;
  if (b.t === 'h3') return `<h3 class="mod reveal"${ed()}>${esc(b.x)}</h3>`;
  if (b.t === 'h4') return `<h4 class="sub reveal"${ed()}>${esc(b.x)}</h4>`;
  if (b.t === 'h5') return `<h5 class="item reveal"${ed()}>${esc(b.x)}</h5>`;
  if (b.t === 'p') return `<p class="b reveal"${ed()}>${esc(b.x)}</p>`;
  if (b.t === 'quote') return `<blockquote class="reveal"${ed()}>${esc(b.x)}</blockquote>`;
  return '';
}

function renderContent(blocks) {
  let html = '', i = 0, hero = '';
  if (blocks[0] && blocks[0].t === 'h1') { hero += blockHtml(blocks[0], 0); i = 1; if (blocks[1] && blocks[1].t === 'meta') { hero += blockHtml(blocks[1], 1); i = 2; } }
  let body = '';
  for (; i < blocks.length; i++) {
    const b = blocks[i];
    if (b.t === 'kv') {
      let group = [], j = i;
      while (j < blocks.length && blocks[j].t === 'kv') { group.push(kvCard(blocks[j], j)); j++; }
      body += `<div class="stats reveal">${group.join('')}</div>`;
      i = j - 1;
    } else {
      body += blockHtml(b, i);
    }
  }
  return hero + body;
}

function tocHtml(blocks) {
  const items = blocks.map((b, i) => b.t === 'h2' ? { i, x: b.x } : null).filter(Boolean);
  if (!items.length) return '';
  return `<nav class="toc"><div class="toc-inner">
    <div class="toc-brand"><i></i>Зміст</div>
    ${items.map(it => `<a href="#${slug(it.i)}" data-target="${slug(it.i)}">${esc(it.x)}</a>`).join('')}
    <div class="toc-progress">~${readTime(blocks)} хв читання</div>
  </div></nav>`;
}

function renderDoc() {
  const root = $('#root');
  root.innerHTML = `<div class="page">
      ${EDIT ? '' : tocHtml(DATA.blocks)}
      <div class="wrap">${renderContent(DATA.blocks)}</div>
    </div>
    ${EDIT ? '<div class="editbadge">Режим редагування</div>' : ''}
    <div class="bar no-print">
      ${EDIT ? `<button class="btn" id="cancelBtn">Скасувати</button><button class="btn pri" id="saveBtn" ${DIRTY ? '' : 'disabled'}>💾 Зберегти</button>` : `<button class="btn" id="editBtn">✎ Редагувати</button>`}
    </div>`;
  if (EDIT) {
    root.querySelectorAll('.edit').forEach(el => el.addEventListener('input', () => { DIRTY = true; const b = $('#saveBtn'); if (b) b.disabled = false; }));
    $('#saveBtn').onclick = saveEdits;
    $('#cancelBtn').onclick = () => { if (DIRTY && !confirm('Скасувати незбережені правки?')) return; EDIT = false; DIRTY = false; load(); };
  } else {
    $('#editBtn').onclick = enterEdit;
    root.querySelectorAll('.toc a').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      const t = document.getElementById(a.dataset.target);
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }
  revealCheck();
}

// позначає видимими всі .reveal-блоки, що вже потрапили у вʼюпорт — перевіряється і при
// рендері, і при кожному скролі, тому навіть швидкий/миттєвий скрол нічого не «губить»
// (на відміну від IntersectionObserver, який реагує лише на сам момент перетину межі)
function revealCheck() {
  const vh = window.innerHeight || document.documentElement.clientHeight;
  document.querySelectorAll('.reveal:not(.visible)').forEach(el => {
    if (el.getBoundingClientRect().top < vh * 0.94) el.classList.add('visible');
  });
}

function collectEdits() {
  document.querySelectorAll('.edit').forEach(el => {
    const i = +el.dataset.idx; const field = el.dataset.field;
    const val = el.innerText.replace(/\n+$/, '');
    if (field) DATA.blocks[i][field] = val; else DATA.blocks[i].x = val;
  });
}

async function saveEdits() {
  collectEdits();
  try { await api('/share/' + token, { method: 'PUT', body: { blocks: DATA.blocks } }); DIRTY = false; EDIT = false; toast('Збережено'); renderDoc(); }
  catch (e) { if (e.status === 401) { ls.set('aso_key', ''); toast('Невірний командний ключ — увійдіть ще раз', true); askKey().then(ok => { if (ok) saveEdits(); }); } else toast(e.message, true); }
}

function askKey() {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><h3>Редагування стратегії</h3><p style="color:var(--tx2);font-size:13px;margin:0 0 10px">Потрібен командний ключ команди BMA.</p><input type="text" id="keyInput" placeholder="Командний ключ" autofocus><div class="row"><button class="btn" id="keyCancel">Скасувати</button><button class="btn pri" id="keyOk">Увійти</button></div></div>`;
    document.body.appendChild(bg);
    $('#keyCancel').onclick = () => { bg.remove(); res(false); };
    $('#keyOk').onclick = () => { const v = $('#keyInput').value.trim(); if (!v) return; ls.set('aso_key', v); bg.remove(); res(true); };
  });
}

async function enterEdit() {
  if (!ls.get('aso_key')) { const ok = await askKey(); if (!ok) return; }
  EDIT = true; DIRTY = false; renderDoc();
}

/* =====================================================================
   V2 PRESENTATION ENGINE — groups[] → modules[] → sections[]. Кожне macro-
   chapter (group) отримує власне візуальне середовище (env-dark/light/accent,
   циклічно, не більше 2 поспіль однакових) і для кожного типу контенту —
   окремий, структурно відмінний компонент (journey-лінія, funnel, positioning
   map, orbit-діаграма, маніфест, повноекранна заява), а не один суцільний
   список однакових карток у фіксованій колонці. Якщо DATA.modules відсутні
   (старе посилання) — працює legacy-рендер вище, без змін.
   ===================================================================== */
const ICON = { insights: '💡', opportunities: '✦', commOpps: '✦', risks: '⚠', priorities: '◆', hypotheses: '🧪' };
let EDITMAP = [];
function edAttr(desc) { if (!EDIT) return ''; const idx = EDITMAP.length; EDITMAP.push(desc); return ` contenteditable="true" class="edit" data-eidx="${idx}"`; }
// для елементів, що вже мають свій семантичний class — додає "edit" до НЬОГО Ж атрибута,
// а не другим class="" (два class= в одному тезі — невалідний HTML і браузер бере лише перший)
function clsEd(base, desc) {
  if (!EDIT) return ` class="${base}"`;
  const idx = EDITMAP.length; EDITMAP.push(desc);
  return ` class="${base} edit" contenteditable="true" data-eidx="${idx}"`;
}

const CHAPTER_TAGS = {
  research: 'Де ми стоїмо зараз: ринок, аудиторія та конкурентне поле, з яких починається стратегія.',
  brand: 'Хто ми: платформа бренду, позиціонування та ідея, що тримає комунікацію разом.',
  smm: 'Як це живе в соцмережах: контент, візуал, звук і регулярні рубрики.',
  meta: 'Платна дистрибуція в Meta: структура кампаній і шлях від охоплення до дії.',
  tiktok: 'TikTok: органічна присутність на території короткого відео.',
  ttads: 'TikTok Ads: платне просування на платформі.',
  google: 'Google Ads: пошуковий і медійний контур performance-стратегії.',
  cross: 'Як канали працюють разом: наскрізна воронка та передача естафети між точками контакту.',
  custom: 'Додаткові матеріали стратегії.'
};
// кожен macro-розділ має власне візуальне середовище; сусідні — не більше 2 поспіль однакових
const ENV_MAP = { research: 'dark', brand: 'dark', smm: 'light', meta: 'dark', tiktok: 'accent', ttads: 'dark', google: 'light', cross: 'light', custom: 'dark' };

const KNOWN_PAIRS = [
  { a: 'sayThis', b: 'notThis', al: 'Говоримо', bl: 'Не говоримо' },
  { a: 'allowed', b: 'forbidden', al: 'Можна', bl: 'Не можна' },
  { a: 'useInReels', b: 'avoid', al: 'Використовуємо', bl: 'Уникаємо' },
  { a: 'use', b: 'avoid', al: 'Використовуємо', bl: 'Уникаємо' },
  { a: 'strengths', b: 'weaknesses', al: 'Сильні сторони', bl: 'Слабкі сторони' },
];
function isBigNum(v) {
  const s = String(v || '').trim();
  if (!s || s.length > 22) return false;
  return /^~?\d[\d.,]*\s?(%|грн|\$|€|x|х)?$/i.test(s) || /^~?\d[\d.,]*\s?(млн|тис|k)\b/i.test(s);
}
function renderSoWhat(text) {
  if (!text) return '';
  return `<div class="sowhat"><div class="sowhat-eyebrow">Що це означає для стратегії</div><div class="sowhat-text">${esc(text)}</div></div>`;
}
// коротке речення як "хедлайн" для data-story секцій Дослідження; якщо речення не знайдено
// (немає крапки/знаку), просто обрізає по слову — повний текст лишається в тому ж editable-полі
function splitHeadline(text) {
  text = String(text || '').trim();
  return text;
}

function wordCountModules(groups) {
  let n = 0; const add = s => { if (!s) return; n += String(s).trim().split(/\s+/).filter(Boolean).length; };
  groups.forEach(g => g.modules.forEach(m => {
    if (m.custom) { add(m.text); return; }
    (m.sections || []).forEach(s => { add(s.text); (s.fields || []).forEach(f => add(f.v)); (s.items || []).forEach(it => { add(it.title); (it.fields || []).forEach(f => add(f.v)); }); });
  }));
  return n;
}
const readTimeModules = groups => Math.max(1, Math.round(wordCountModules(groups) / 180));

function findSection(groups, modId, secKey) {
  for (const g of groups) for (const m of g.modules) if (m.id === modId) for (const s of (m.sections || [])) if (s.key === secKey) return s;
  return null;
}
function findSegmentTitle(groups, segId) {
  const s = findSection(groups, 'audience', 'segments'); if (!s || !s.items) return null;
  const it = s.items.find(x => x.id === segId); return it ? it.title : null;
}
function heroStats(groups) {
  const stats = [];
  const seg = findSection(groups, 'audience', 'segments'); if (seg && seg.items && seg.items.length) stats.push({ v: seg.items.length, l: 'сегментів ЦА' });
  const comp = findSection(groups, 'competitors', 'matrix'); if (comp && comp.items && comp.items.length) stats.push({ v: comp.items.length, l: 'конкурентів' });
  const ins = findSection(groups, 'insightsA', 'insights'); if (ins && ins.items && ins.items.length) stats.push({ v: ins.items.length, l: 'стратегічних висновків' });
  const hyp = findSection(groups, 'insightsA', 'hypotheses'); if (hyp && hyp.items && hyp.items.length) stats.push({ v: hyp.items.length, l: 'гіпотез до перевірки' });
  return stats.slice(0, 4);
}

function renderTextSec(gi, mi, si, sec, story) {
  const txt = sec.text || '';
  let h = `<div class="${story ? 'story ' : ''}reveal">`;
  if (story) {
    const big = txt.length <= 170;
    h += `<div class="t-eyebrow" style="margin-bottom:18px">${esc(sec.title)}</div>`;
    h += `<div${clsEd(big ? 'headline' : 'sub', { kind: 'sectext', gi, mi, si })}>${esc(splitHeadline(txt))}</div>`;
  } else {
    h += `<div class="m-subtitle">${esc(sec.title)}</div><div class="proseblock"><p${edAttr({ kind: 'sectext', gi, mi, si })}>${esc(txt)}</p></div>`;
  }
  if (sec.implication) h += renderSoWhat(sec.implication);
  if (sec.hypotheses && sec.hypotheses.length) h += `<blockquote>Гіпотези (потребують перевірки): ${esc(sec.hypotheses.join(' | '))}</blockquote>`;
  return h + `</div>`;
}
// Поля — НЕ суцільна сітка однакових карток. Коротке число → велика заява (.bignum);
// відома пара протилежних полів → split-блок; решта коротких полів → "стрічка" без рамок;
// довгі описові поля → проза. CARD ≠ default.
function renderFieldsSec(gi, mi, si, sec) {
  const present = sec.fields.filter(f => f.v);

  if (sec.kind === 'text') return `<div class="frame-wide">${renderTextSec(gi, mi, si, sec, groupKey === 'research')}</div>`;
  if (sec.kind === 'fields') {
    if (modId === 'brand' && sec.key === 'platform') return `<div class="frame-wide">${renderManifesto(gi, mi, si, sec)}</div>`;
    if (modId === 'communication' && sec.key === 'bigidea') return renderBigIdea(gi, mi, si, sec);
    return `<div class="frame-narrow">${renderFieldsSec(gi, mi, si, sec)}</div>`;
  }
  if (sec.kind === 'refs') return `<div class="frame-narrow">${renderRefsSec(sec)}</div>`;
  if (sec.kind === 'list') {
    if (modId === 'audience' && sec.key === 'segments') return renderSegments(gi, mi, si, sec);
    if (modId === 'competitors' && sec.key === 'matrix') return renderCompetitorMap(gi, mi, si, sec, groups);
    if (modId === 'cross_funnel' && sec.key === 'nodes') return renderCrossFlow(gi, mi, si, sec);
    if (modId === 'smm_rubrics' && sec.key === 'posts') return renderSmmOrbit(gi, mi, si, sec);
    if (sec.isFunnel) return `<div class="frame-narrow">${renderFunnel(gi, mi, si, sec)}</div>`;
    return `<div class="frame-wide">${renderItemGrid(gi, mi, si, sec, groups, ICON[sec.key], sec.key === 'insights')}</div>`;
  }
  return '';
}
function renderModule(gi, mi, mod, groups, groupKey) {
  let h = `<div class="frame-narrow" style="padding-bottom:0"><div class="m-modtitle reveal">${esc(mod.title)}</div></div>`;
  if (mod.custom) return h + `<div class="frame-narrow"><div class="reveal"><p${clsEd('b', { kind: 'modtext', gi, mi })}>${esc(mod.text || '')}</p></div></div>`;
  (mod.sections || []).forEach((sec, si) => { h += renderSection(gi, mi, si, sec, groups, mod.id, groupKey); });
  return h;
}
function renderGroup(gi, g, groups) {
  const tag = CHAPTER_TAGS[g.groupKey] || '';
  const env = ENV_MAP[g.groupKey] || 'dark';
  let h = `<div class="mchapter-env env-${env}" id="sec-${gi}">`;
  h += `<div class="mchapter reveal">
      <div class="mnum"><i></i>Розділ ${pad2(gi + 1)} / ${pad2(groups.length)}</div>
      <h2 class="t-chapter mtitle">${esc(g.label)}</h2>
      ${tag ? `<div class="mtag">${esc(tag)}</div>` : ''}
    </div>`;
  g.modules.forEach((mod, mi) => { h += renderModule(gi, mi, mod, groups, g.groupKey); });
  h += `</div>`;
  return h;
}
function renderSourcesSection(sources, gi) {
  if (!sources || !sources.length) return '';
  const cards = sources.map(s => `<div class="srccard"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>${s.date ? ' · ' + esc(s.date) : ''}${s.evidence ? `<div class="note">${esc(s.evidence)}</div>` : ''}</div>`).join('');
  return `<div class="mchapter-env env-dark" id="sec-${gi}"><div class="frame-wide" style="padding-top:70px;padding-bottom:70px"><div class="reveal"><div class="t-eyebrow" style="margin-bottom:20px">Джерела</div><div class="srclist">${cards}</div></div></div></div>`;
}
function renderHeroModules() {
  const groups = DATA.modules;
  let h = `<div class="mhero"><div class="mhero-brand"><i></i><span>BESSARAB M.A.</span></div>`;
  h += `<h1 class="t-display">Стратегія: <span${edAttr({ kind: 'name' })}>${esc(DATA.name)}</span></h1>`;
  if (DATA.meta) h += `<div${clsEd('meta', { kind: 'meta' })}>${esc(DATA.meta)}</div>`;
  const hs = heroStats(groups);
  if (hs.length) h += `<div class="mhero-nums">${hs.map(s => `<div class="mhero-num"><b>${s.v}</b><span>${esc(s.l)}</span></div>`).join('')}</div>`;
  h += `<div class="mhero-scroll"><i></i>~${readTimeModules(groups)} хв · гортайте</div>`;
  h += `</div>`;
  return h;
}

let GROUP_COUNT = 0, GROUP_LABELS = [];
function renderModulesDoc() {
  EDITMAP = [];
  const groups = DATA.modules;
  GROUP_COUNT = groups.length;
  GROUP_LABELS = groups.map(g => g.label);
  let body = renderHeroModules();
  groups.forEach((g, gi) => { body += renderGroup(gi, g, groups); });
  const srcGi = groups.length;
  body += renderSourcesSection(DATA.sources, srcGi);

  const navItems = groups.map((g, gi) => ({ i: gi, x: g.label }));
  if (DATA.sources && DATA.sources.length) navItems.push({ i: srcGi, x: 'Джерела' });

  const floatnav = EDIT ? '' : `<div class="floatnav"><button class="floatnav-pill" id="navToggle"><span class="nn" id="navNum">${pad2(1)}/${pad2(groups.length)}</span><span class="nl" id="navLabel">${esc(groups[0] ? groups[0].label : '')}</span></button></div>`;
  const dotrail = EDIT ? '' : `<div class="dotrail" id="dotrail">${navItems.map((it, di) => `<button type="button" data-dotjump="sec-${it.i}" class="${di === 0 ? 'active' : ''}" title="${esc(it.x)}"></button>`).join('')}</div>`;
  const overlay = EDIT ? '' : `<div class="navoverlay" id="navOverlay"><button class="nclose" id="navClose">✕</button><div class="nlist">${navItems.map(it => `<a href="#sec-${it.i}" data-target="sec-${it.i}">${esc(it.x)}</a>`).join('')}</div></div>`;

  const root = $('#root');
  root.innerHTML = `${floatnav}${dotrail}${overlay}<div class="mpage">${body}</div>
    ${EDIT ? '<div class="editbadge">Режим редагування</div>' : ''}
    <div class="bar no-print">
      ${EDIT ? `<button class="btn" id="cancelBtn">Скасувати</button><button class="btn pri" id="saveBtn" ${DIRTY ? '' : 'disabled'}>💾 Зберегти</button>` : `<button class="btn" id="editBtn">✎ Редагувати</button>`}
    </div>`;

  if (EDIT) {
    root.querySelectorAll('.edit').forEach(el => el.addEventListener('input', () => { DIRTY = true; const b = $('#saveBtn'); if (b) b.disabled = false; }));
    $('#saveBtn').onclick = saveEditsModules;
    $('#cancelBtn').onclick = () => { if (DIRTY && !confirm('Скасувати незбережені правки?')) return; EDIT = false; DIRTY = false; load(); };
  } else {
    $('#editBtn').onclick = enterEditModules;
    $('#navToggle')?.addEventListener('click', () => $('#navOverlay')?.classList.add('open'));
    $('#navClose')?.addEventListener('click', () => $('#navOverlay')?.classList.remove('open'));
    $('#navOverlay')?.addEventListener('click', e => { if (e.target.id === 'navOverlay') $('#navOverlay')?.classList.remove('open'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#navOverlay')?.classList.remove('open'); });
    root.querySelectorAll('.navoverlay a').forEach(a => a.addEventListener('click', e => {
      e.preventDefault(); $('#navOverlay')?.classList.remove('open');
      const t = document.getElementById(a.dataset.target); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
    root.querySelectorAll('[data-dotjump]').forEach(b => b.addEventListener('click', () => {
      const t = document.getElementById(b.dataset.dotjump); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }

  root.querySelectorAll('[data-segpanels]').forEach(panelWrap => {
    const uid = panelWrap.dataset.segpanels;
    const scope = panelWrap.closest('.frame-split') || root;
    const panels = [...panelWrap.querySelectorAll('.segpanel2')];
    const dots = [...scope.querySelectorAll(`[data-segjump^="${uid}-"]`)];
    const labelEl = scope.querySelector('.seglabel');
    let idx = 0;
    function show(i) {
      idx = ((i % panels.length) + panels.length) % panels.length;
      panels.forEach((p, pi) => p.classList.toggle('active', pi === idx));
      dots.forEach((d, di) => { const on = di === idx; d.style.background = on ? 'var(--ac)' : 'var(--line2)'; d.style.width = on ? '9px' : '7px'; d.style.height = on ? '9px' : '7px'; });
      if (labelEl) labelEl.textContent = pad2(idx + 1) + ' / ' + pad2(panels.length);
    }
    scope.querySelector(`[data-segprev="${uid}"]`)?.addEventListener('click', () => show(idx - 1));
    scope.querySelector(`[data-segnext="${uid}"]`)?.addEventListener('click', () => show(idx + 1));
    dots.forEach((d, di) => d.addEventListener('click', () => show(di)));
  });
  root.querySelectorAll('.hjourney').forEach(hj => {
    const steps = [...hj.querySelectorAll('.hjourney-step')];
    const detail = hj.querySelector('.hjourney-detail');
    steps.forEach((s, i) => s.addEventListener('click', () => {
      steps.forEach((x, xi) => x.classList.toggle('active', xi === i));
      if (detail) detail.textContent = s.dataset.val;
    }));
  });

  revealCheck();
}

function collectEditsModules() {
  document.querySelectorAll('.edit').forEach(el => {
    const d = EDITMAP[+el.dataset.eidx]; if (!d) return;
    const val = el.innerText.replace(/\n+$/, '');
    if (d.kind === 'name') { DATA.name = val; return; }
    if (d.kind === 'meta') { DATA.meta = val; return; }
    const mod = DATA.modules[d.gi].modules[d.mi];
    if (d.kind === 'modtext') mod.text = val;
    else if (d.kind === 'sectext') mod.sections[d.si].text = val;
    else if (d.kind === 'secfieldv') mod.sections[d.si].fields[d.fi].v = val;
    else if (d.kind === 'itemtitle') mod.sections[d.si].items[d.ii].title = val;
    else if (d.kind === 'itemfieldv') mod.sections[d.si].items[d.ii].fields[d.fi].v = val;
  });
}
async function saveEditsModules() {
  collectEditsModules();
  try {
    await api('/share/' + token, { method: 'PUT', body: { modules: DATA.modules, name: DATA.name, meta: DATA.meta } });
    DIRTY = false; EDIT = false; toast('Збережено'); renderModulesDoc();
  } catch (e) { if (e.status === 401) { ls.set('aso_key', ''); toast('Невірний командний ключ — увійдіть ще раз', true); askKey().then(ok => { if (ok) saveEditsModules(); }); } else toast(e.message, true); }
}
async function enterEditModules() {
  if (!ls.get('aso_key')) { const ok = await askKey(); if (!ok) return; }
  EDIT = true; DIRTY = false; renderModulesDoc();
}

async function load() {
  try {
    DATA = await api('/share/' + token);
    document.title = DATA.name || 'Стратегія';
    if (DATA.modules && DATA.modules.length) renderModulesDoc(); else renderDoc();
  } catch (e) {
    $('#root').innerHTML = `<div class="center"><h1>Сторінку не знайдено</h1><p style="color:var(--tx2)">Посилання застаріло або стратегію знято з публікації.</p></div>`;
  }
}
load();

// прогрес-бар читання + підсвітка активного розділу у floatnav/dotrail/overlay (і в legacy .toc,
// якщо використовується старий рендер) — глобально, не залежить від того, який рендер активний
let ticking = false;
function onScroll() {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const h = document.documentElement;
    const scrolled = h.scrollTop || document.body.scrollTop;
    const max = (h.scrollHeight || document.body.scrollHeight) - h.clientHeight;
    const pct = max > 0 ? Math.min(100, (scrolled / max) * 100) : 0;
    const pb = $('#progress'); if (pb) pb.style.width = pct + '%';
    const secs = document.querySelectorAll('.mchapter-env[id], h2.sec[id]');
    if (secs.length) {
      let current = null;
      secs.forEach(s => { if (s.getBoundingClientRect().top < 140) current = s.id; });
      document.querySelectorAll('.toc a').forEach(a => a.classList.toggle('active', a.dataset.target === current));
      if (current) {
        document.querySelectorAll('[data-dotjump]').forEach(d => d.classList.toggle('active', d.dataset.dotjump === current));
        document.querySelectorAll('.navoverlay a').forEach(a => a.classList.toggle('active', a.dataset.target === current));
        const m = /^sec-(\d+)$/.exec(current);
        if (m && GROUP_COUNT) {
          const n = +m[1];
          const nn = $('#navNum'), nl = $('#navLabel');
          if (nn) nn.textContent = pad2(Math.min(n + 1, GROUP_COUNT)) + '/' + pad2(GROUP_COUNT);
          if (nl) nl.textContent = n < GROUP_COUNT ? GROUP_LABELS[n] : 'Джерела';
        }
      }
    }
    revealCheck();
    ticking = false;
  });
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', () => requestAnimationFrame(revealCheck), { passive: true });
</script>
</body>
