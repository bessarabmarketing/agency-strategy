<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор стратегій</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
/* BMA / BESSARAB M.A. — dark, acid-lime accent, Unbounded + Manrope */
:root{--bg:#0b0b0c;--panel:#141416;--panel2:#1a1a1c;--line:rgba(244,243,238,.13);--line2:rgba(244,243,238,.24);--tx:#f4f3ee;--tx2:#a5a49d;--tx3:#6c6b66;
--ac:#cbff2e;--ac2:rgba(203,255,46,.10);--acd:#93b81f;--acink:#0c1300;--acline:rgba(203,255,46,.38);
--ok:#7ddc8f;--ok2:rgba(125,220,143,.10);--okl:rgba(125,220,143,.35);--warn:#f5b84b;--warn2:rgba(245,184,75,.10);--warnl:rgba(245,184,75,.35);
--bad:#ff7a70;--bad2:rgba(255,122,112,.10);--badl:rgba(255,122,112,.35);--info:#7cb7ff;--info2:rgba(124,183,255,.10);--infol:rgba(124,183,255,.35);
--r:18px;--fd:'Unbounded','Manrope',sans-serif;--fb:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.55 var(--fb);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--ac)}
::selection{background:var(--ac);color:var(--acink)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(244,243,238,.18);border-radius:10px}::-webkit-scrollbar-track{background:transparent}
#app{display:grid;grid-template-columns:244px 1fr;height:100vh}
#side{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
#main{overflow-y:auto;min-width:0;background:var(--bg)}
.brand{padding:20px 18px 12px;font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:-.01em;display:flex;gap:10px;align-items:center;line-height:1.2}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--ac);display:inline-block;flex:none}
.nav{padding:4px 10px}
.nav h6{margin:16px 10px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);font-weight:700}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;color:var(--tx2);text-decoration:none;cursor:pointer;font-size:13.5px;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--panel);color:var(--tx)}
.nav a.on{background:var(--ac);color:var(--acink);font-weight:700}
.nav a.on .dot{color:var(--acink)}
.nav .dot{margin-left:auto;font-size:11px;color:var(--tx3)}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--tx3)}
.top{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--fd);font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
.top .sp{flex:1}
.wrap{padding:24px 28px 70px;max-width:1240px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-family:var(--fd);font-size:14px;font-weight:600;letter-spacing:-.005em}
.card h4{margin:16px 0 6px;font-size:11.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
h2{font-family:var(--fd);font-weight:600;letter-spacing:-.01em}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){#app{grid-template-columns:1fr}#side{display:none}.g2,.g3,.g4{grid-template-columns:1fr}.wrap{padding:16px}.top{padding:12px 16px}}
.btn{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:7px 16px;color:var(--tx);white-space:nowrap;font-weight:600;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--panel2);border-color:var(--tx3)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acink);font-weight:700}.btn.pri:hover{background:#d9ff62;border-color:#d9ff62}
.btn.sm{padding:4px 12px;font-size:12.5px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06210d;font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--badl)}.btn.danger:hover{background:var(--bad2);border-color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line2);color:var(--tx2);background:transparent;white-space:nowrap;font-weight:500}
.chip.ok{background:var(--ok2);border-color:var(--okl);color:var(--ok)}.chip.warn{background:var(--warn2);border-color:var(--warnl);color:var(--warn)}.chip.bad{background:var(--bad2);border-color:var(--badl);color:var(--bad)}.chip.info{background:var(--info2);border-color:var(--infol);color:var(--info)}.chip.ac{background:var(--ac2);border-color:var(--acline);color:var(--ac)}
.muted{color:var(--tx3)}.sm{font-size:12.5px}.t2{color:var(--tx2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:rgba(244,243,238,.10);overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .3s}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:4px;font-weight:600}
input[type=text],input[type=url],input[type=number],select,textarea{width:100%;font:inherit;padding:9px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--panel2);color:var(--tx)}
input::placeholder,textarea::placeholder{color:var(--tx3)}
select option{background:var(--panel2);color:var(--tx)}
textarea{min-height:68px;resize:vertical}
input[type=checkbox],input[type=radio]{accent-color:var(--ac)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acline);outline-offset:0;border-color:var(--ac)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:5px 14px;border:1px solid var(--line2);border-radius:99px;cursor:pointer;background:transparent;font-size:13px;user-select:none;color:var(--tx2);transition:all .15s}
.tag:hover{border-color:var(--tx3);color:var(--tx)}
.tag.on{background:var(--ac);border-color:var(--ac);color:var(--acink);font-weight:700}
.stepper{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.step{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--tx2)}
.step b{width:20px;height:20px;border-radius:50%;background:rgba(244,243,238,.10);display:inline-grid;place-items:center;font-size:11px;color:var(--tx2)}
.step.done{border-color:var(--okl)}.step.done b{background:var(--ok);color:#06210d}
.step.cur{border-color:var(--ac);color:var(--ac);font-weight:700}.step.cur b{background:var(--ac);color:var(--acink)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
tr.click:hover{background:var(--panel2);cursor:pointer}
.mod{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:14px}
.mod>.mh{display:flex;gap:10px;align-items:center;padding:14px 18px;cursor:pointer;flex-wrap:wrap}
.mod>.mh .ttl{font-family:var(--fd);font-weight:600;font-size:13.5px}
.mod>.mb{padding:0 18px 18px;border-top:1px solid var(--line)}
.mod.blocked>.mh{opacity:.85}
.sec{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec>.sh{padding:10px 14px;background:var(--panel2);font-weight:700;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sec>.sb{padding:12px 14px}
.kv{display:grid;grid-template-columns:190px 1fr;gap:4px 12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--tx3);font-size:12.5px}.kv .v{white-space:pre-wrap;word-break:break-word}
@media(max-width:760px){.kv{grid-template-columns:1fr}}
.item{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--panel)}
.item>.ih{padding:9px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-weight:700;display:flex;gap:8px;align-items:center;border-radius:14px 14px 0 0}
.item>.ib{padding:8px 14px}
.impl{margin-top:12px;background:var(--ac2);border:1px solid var(--acline);border-radius:14px;padding:12px 14px}
.impl b.t{color:var(--ac);display:block;margin-bottom:4px}
.impl .kv{border-color:var(--acline)}
.claims{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.claim{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);max-width:100%}
.claim.client_data{background:var(--info2);border-color:var(--infol)}.claim.external_research{background:var(--ok2);border-color:var(--okl)}.claim.ai_inference{background:rgba(244,243,238,.06)}.claim.ai_hypothesis{background:var(--warn2);border-color:var(--warnl)}
.warnbox{background:var(--warn2);border:1px solid var(--warnl);border-radius:14px;padding:10px 14px;margin:12px 0;color:var(--warn)}
.errbox{background:var(--bad2);border:1px solid var(--badl);border-radius:14px;padding:10px 14px;margin:12px 0;color:var(--bad)}
.okbox{background:var(--ok2);border:1px solid var(--okl);border-radius:14px;padding:10px 14px;margin:12px 0;color:var(--ok)}
.infobox{background:var(--info2);border:1px solid var(--infol);border-radius:14px;padding:10px 14px;margin:12px 0;color:var(--info)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:9px 16px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs a:hover{color:var(--tx)}
.tabs a.on{color:var(--ac);border-color:var(--ac);font-weight:700}
.dnd{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:8px}
.dnd.over{border-color:var(--ac);background:var(--ac2)}
.dnd.hid{opacity:.5}
.dnd .h{cursor:grab;color:var(--tx3);font-size:16px;user-select:none}
.dnd .ttl{flex:1;min-width:0}
.dnd input.rn{border:1px solid transparent;background:transparent;padding:2px 8px;font-weight:700;border-radius:8px}
.dnd input.rn:hover,.dnd input.rn:focus{border-color:var(--line2);background:var(--panel2)}
.svc{border:1px solid var(--line2);border-radius:16px;padding:14px;background:var(--panel);cursor:pointer;display:flex;gap:12px;transition:border-color .15s,background .15s}
.svc:hover{border-color:var(--tx3)}
.svc.on{border-color:var(--ac);background:var(--ac2)}
.svc input{margin-top:3px}
.lock-banner{display:flex;gap:12px;align-items:center;background:var(--ac);color:var(--acink);border-radius:16px;padding:16px 18px;margin-bottom:18px;font-weight:600}
.lock-banner .sm{color:var(--acink)}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(203,255,46,.25);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;right:18px;bottom:78px;background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:12px 18px;border-radius:14px;z-index:50;max-width:380px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.toast.err{background:#2a1211;border-color:var(--badl);color:var(--bad)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:40}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:24px;padding:26px;width:min(560px,92vw);max-height:88vh;overflow:auto}
.modal h3{margin:0 0 14px;font-family:var(--fd);font-size:16px;font-weight:600}
.cm{border-left:3px solid var(--ac);padding:6px 12px;margin:8px 0;background:var(--panel2);border-radius:0 10px 10px 0}
.cm.res{opacity:.55}
pre.json{background:var(--panel2);border-radius:14px;padding:12px;overflow:auto;max-height:420px;font-size:12px;color:var(--tx2)}
svg text{font:12px var(--fb);fill:var(--tx)}
.node{cursor:pointer}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:32px 38px}
.doc h1{font-family:var(--fd);font-size:24px;margin:0 0 4px;font-weight:600}.doc h2{font-size:18px;margin:30px 0 10px;border-bottom:1px solid var(--line);padding-bottom:8px}.doc h3{font-family:var(--fd);font-size:14px;margin:20px 0 6px;font-weight:600}.doc h4{font-size:12px;margin:14px 0 4px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em}
hr{border:0;border-top:1px solid var(--line)}
@media print{#side,.top,.no-print{display:none!important}#app{display:block;height:auto}#main{overflow:visible;background:#fff}.doc{border:0;padding:0;background:#fff;color:#111}.doc *{color:#111!important;background:transparent!important;border-color:#ccc!important}body{background:#fff;color:#111}}
</style>
</head>
<body>
<div id="app"><aside id="side"></aside><main id="main"></main></div>
<div id="overlay"></div>
<script>
/* =====================================================================
   МЕТОДОЛОГІЯ АГЕНЦІЇ (CFG) — декларативна конфігурація.
   Тут описано: послуги, правила Service→Module, модулі та їхні секції,
   залежності, агенти. Змінення методології = зміна цього блоку (або
   перевизначення промптів у розділі «AI-агенти»), а не UI-коду.
   ===================================================================== */
const F = s => s.split('|').map(x => { const i = x.indexOf(':'); return { k: x.slice(0, i), l: x.slice(i + 1) }; });
const CFG = {};
CFG.VERSION = '1.0';

/* ---------- Послуги ---------- */
CFG.SERVICES = [
  { id: 'instagram', group: 'CONTENT', label: 'Instagram', channel: 'smm', desc: 'Контент-супровід Instagram' },
  { id: 'facebook', group: 'CONTENT', label: 'Facebook (кросспостинг)', channel: 'smm', desc: 'Кросспостинг / контент Facebook' },
  { id: 'meta_ads', group: 'PAID MEDIA', label: 'Meta Ads', channel: 'meta', desc: 'Реклама у Facebook / Instagram' },
  { id: 'google_ads', group: 'PAID MEDIA', label: 'Google Ads', channel: 'google', desc: 'Search, PMax, Shopping — за потреби' },
  { id: 'tiktok_org', group: 'TIKTOK', label: 'TikTok органіка', channel: 'tiktok', desc: 'Органічний контент у TikTok' },
  { id: 'tiktok_ads', group: 'TIKTOK', label: 'TikTok Ads', channel: 'tta', desc: 'Реклама у TikTok' },
];
CFG.CHANNEL_LABELS = { smm: 'Instagram / Facebook (контент)', meta: 'Meta Ads', google: 'Google Ads', tiktok: 'TikTok органіка', tta: 'TikTok Ads' };

/* ---------- Групи модулів = розділи sidebar ---------- */
CFG.GROUPS = {
  research: { label: 'Дослідження', page: 'research' },
  brand: { label: 'Бренд', page: 'brand' },
  smm: { label: 'SMM', page: 'smm' },
  meta: { label: 'Meta Ads', page: 'meta', svc: 'meta_ads' },
  tiktok: { label: 'TikTok', page: 'tiktok', svc: 'tiktok_org' },
  ttads: { label: 'TikTok Ads', page: 'ttads', svc: 'tiktok_ads' },
  google: { label: 'Google Ads', page: 'google', svc: 'google_ads' },
  cross: { label: 'Кросканальність', page: 'cross' },
};
CFG.LEVEL = { mandatory: { icon: '🔒', label: 'Обов\'язковий', w: 3 }, recommended: { icon: '★', label: 'Рекомендований', w: 2 }, optional: { icon: '○', label: 'Опціональний', w: 1 } };

/* ---------- Правила Service → Module (єдине місце!) ----------
   when: предикат над послугами / брифом; enable: {module: рівень}; sections: {module: [ext-секції]} */
CFG.RULES = [
  { id: 'core', when: { always: true }, enable: {
    market: 'mandatory', audience: 'mandatory', avatars: 'mandatory', competitors: 'mandatory', insightsA: 'mandatory',
    brand: 'mandatory', valueprop: 'mandatory', communication: 'mandatory', architectB: 'mandatory' } },
  { id: 'content', when: { anyHas: ['instagram', 'facebook'] }, enable: {
    smm_audit: 'mandatory', smm_visual: 'mandatory', smm_rubrics: 'mandatory', smm_sound: 'recommended', smm_examples: 'recommended', smm_contests: 'optional' } },
  { id: 'meta', when: { has: 'meta_ads' }, enable: { meta_audit: 'mandatory', meta_audience: 'mandatory', meta_strategy: 'mandatory', meta_launch: 'mandatory', meta_creative: 'mandatory' }, sections: { competitors: ['ext_meta'] } },
  { id: 'tiktok_org', when: { has: 'tiktok_org' }, enable: { tt_org: 'mandatory' }, sections: { competitors: ['ext_tiktok'] } },
  { id: 'tiktok_ads', when: { has: 'tiktok_ads' }, enable: { tta_strategy: 'mandatory', tta_creative: 'mandatory' }, sections: { competitors: ['ext_tiktok'] } },
  { id: 'tiktok_syn', when: { all: [{ has: 'tiktok_org' }, { has: 'tiktok_ads' }] }, enable: { tt_synergy: 'mandatory' } },
  { id: 'google', when: { has: 'google_ads' }, enable: { g_audit: 'mandatory', g_intent: 'mandatory', g_structure: 'mandatory' }, sections: { competitors: ['ext_google'] } },
  { id: 'google_shop', when: { all: [{ has: 'google_ads' }, { brief: { bizModel: 'ecommerce' } }] }, sections: { g_structure: ['shopping'] } },
  { id: 'cross', when: { channelsGt: 1 }, enable: { cross_funnel: 'mandatory' } },
  { id: 'paid_syn', when: { anyHas: ['meta_ads', 'tiktok_ads', 'google_ads'] }, enable: { synergy_paid: 'mandatory' } },
];
CFG.evalWhen = function (w, c) {
  if (!w || w.always) return true;
  if (w.has) return c.svc.has(w.has);
  if (w.anyHas) return w.anyHas.some(x => c.svc.has(x));
  if (w.allHas) return w.allHas.every(x => c.svc.has(x));
  if (w.channelsGt != null) return c.channels.size > w.channelsGt;
  if (w.brief) return Object.entries(w.brief).every(([k, v]) => c.brief[k] === v);
  if (w.all) return w.all.every(x => CFG.evalWhen(x, c));
  if (w.any) return w.any.some(x => CFG.evalWhen(x, c));
  if (w.not) return !CFG.evalWhen(w.not, c);
  return true;
};

/* ---------- Агенти ---------- */
CFG.GLOBAL_RULES = `Ти — старший стратег digital-агенції. Працюєш ТІЛЬКИ в межах Контекст проєкту, який надано у запиті.
ЖОРСТКІ ПРАВИЛА:
1. Відповідай виключно українською. Виводь ТІЛЬКИ валідний JSON за заданою схемою — без markdown-огорож, коментарів і пояснень поза JSON.
2. НЕ вигадуй статистику, результати досліджень, назви конкурентів, рекламні показники конкурентів, бюджети. Якщо даних бракує — пиши «Немає даних: <що саме потрібно уточнити>» замість припущення.

}

/* ---------- Нормалізація й перевірка AI-виводу ---------- */

}
function pTop(p, title, right = '') {

function fieldHtml(f, val, attr) {

  let inp;
  if (f.t === 'area') inp = `<textarea ${attr}="${f.k}">${esc(val || '')}</textarea>`;
  else if (f.t === 'select') inp = `<select ${attr}="${f.k}"><option value="">—</option>${f.o.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${val === v ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;

}

function briefView(p) {

}

document.addEventListener('dragstart', e => { const r = e.target.closest && e.target.closest('[data-dnd]'); if (r) { S.ui.drag = r.dataset.dnd; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', S.ui.drag); } });

/* ---------- Картка модуля та секції ---------- */
function verdictChip(v) { return v === 'conflict' ? chip('✕ Конфлікт', 'bad') : v === 'warn' ? chip('⚠ Потребує доопрацювання', 'warn') : chip('✓ Узгоджено', 'ok'); }
function claimsHtml(cl) { return cl && cl.length ? `<div class="claims">${cl.map(c => `<span class="claim ${c.type}" title="${esc(CLAIM_TYPES[c.type])}">${c.type === 'ai_hypothesis' ? '❓ гіпотеза: ' : c.type === 'external_research' ? '🔗 ' : c.type === 'client_data' ? '📋 ' : '💡 '}${esc(c.text)}${c.source ? ' · ' + linkOf(c.source) : ''}</span>`).join('')}</div>` : ''; }
function implHtml(im) { return im ? `<div class="impl"><b class="t">Що це означає для нашої стратегії?</b>${[['learned', 'Що ми дізналися'], ['why', 'Чому це важливо'], ['impact', 'Як це впливає на стратегію'], ['action', 'Що конкретно ми робимо']].map(([k, l]) => `<div class="kv"><div class="k">${l}</div><div class="v">${esc(im[k])}</div></div>`).join('')}</div>` : ''; }
function inp(v, attrs, big) { return big || String(v).length > 70 || /\n/.test(v) ? `<textarea ${attrs}>${esc(v)}</textarea>` : `<input type="text" ${attrs} value="${esc(v)}">`; }
function secHtml(p, id, s, edit) {
  const m = p.modules[id]; const sec = m && m.sections[s.key];
  if (s.kind === 'refs') { const refs = (sec && sec.refs) || (m && m.sections[s.key] && m.sections[s.key].refs) || []; return `<div class="sec"><div class="sh">${esc(s.title)}</div><div class="sb">${refs.map((r, i) => `<div class="kv"><div class="k">${esc(r.title || 'Референс')}</div><div class="v">${linkOf(r.url)} ${esc(r.note || '')} <button class="btn sm danger" data-act="delRef" data-id="${id}" data-s="${s.key}" data-i="${i}">×</button></div></div>`).join('') || '<div class="muted sm">Референсів ще немає</div>'}<div class="row" style="margin-top:8px"><input type="text" id="rf_u_${id}" placeholder="URL референсу" style="flex:2"><input type="text" id="rf_t_${id}" placeholder="Назва" style="flex:1"><input type="text" id="rf_n_${id}" placeholder="Нотатка: що саме беремо" style="flex:2"><button class="btn sm" data-act="addRef" data-id="${id}" data-s="${s.key}">Додати</button></div></div></div>`; }
  if (!sec) return `<div class="sec"><div class="sh">${esc(s.title)} ${s.ext ? chip('розширення', 'info') : ''}</div><div class="sb muted sm">Ще не згенеровано</div></div>`;
  const ea = (i, f) => `data-e="1" data-m="${id}" data-s="${s.key}" data-i="${i}" data-f="${f}"`;
  let body = '';
  if (s.kind === 'text') body = edit ? `<textarea ${ea('', '')} style="min-height:120px">${esc(sec.data)}</textarea>` : `<div style="white-space:pre-wrap">${esc(sec.data)}</div>`;
  else if (s.kind === 'fields') body = s.fields.map(f => `<div class="kv"><div class="k">${esc(f.l)}</div><div class="v">${edit ? inp(sec.data[f.k], ea('', f.k)) : esc(sec.data[f.k])}</div></div>`).join('');
  else {
    if (id === 'cross_funnel' && s.key === 'nodes') body += `<div class="row" style="margin-bottom:8px">${sec.data.map((n, i) => `${i ? '<span class="muted">→</span>' : ''}<span class="chip ac">${esc(n.stage)} · ${esc(n.channel)}</span>`).join('')}</div>`;
    body += sec.data.map((it, i) => `<div class="item"><div class="ih">${it.id ? chip(it.id, 'ac') : ''}${esc(it[s.titleField] || 'Елемент ' + (i + 1))}${it._invalid ? chip('⚠ невалідний зв\'язок', 'warn') : ''}${it.verdict ? verdictChip(it.verdict) : ''}</div><div class="ib">${s.fields.filter(f => f.k !== s.titleField && f.k !== 'verdict').map(f => `<div class="kv"><div class="k">${esc(f.l)}</div><div class="v">${edit ? inp(it[f.k], ea(i, f.k)) : esc(it[f.k])}</div></div>`).join('')}</div></div>`).join('') || '<div class="muted">Порожньо</div>';
  }
  return `<div class="sec"><div class="sh">${esc(s.title)} ${sec.edited ? chip('✎ відредаговано') : ''} ${s.ext ? chip('розширення', 'info') : ''} ${(sec.warnings || []).length ? chip('⚠ ' + sec.warnings.length, 'warn') : ''}</div><div class="sb">${body}${implHtml(sec.implication)}${claimsHtml(sec.claims)}</div></div>`;
}
function modCard(p, id, forceOpen) {

  const svg = `<svg width="${svgW}" height="${svgH}" style="background:#0e0e10;border:1px solid var(--line);border-radius:18px"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6c6b66"/></marker></defs>` +
    edges.filter(e => pos[e[0]] && pos[e[1]]).map(e => { const a = pos[e[0]], b = pos[e[1]]; const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2; const hi = foc && rel.has(e[0]) && rel.has(e[1]) && (e[0] === foc || e[1] === foc || (rel.has(e[0]) && rel.has(e[1]))); const dim = foc && !hi; return `<path d="M${x1},${y1} C${x1 + 40},${y1} ${x2 - 40},${y2} ${x2},${y2}" fill="none" stroke="${hi ? '#cbff2e' : dim ? '#1c1c1f' : e[2] ? '#5a5a58' : '#2c2c2f'}" stroke-width="${hi ? 1.8 : 1}" ${e[2] ? '' : 'stroke-dasharray="4 3"'} marker-end="url(#ar)"/>`; }).join('') +
    nodes.map(n => { const q = pos[n.id]; const st = CFG.M[n.id] ? statusOf(p, n.id) : { k: n.id === 'qa' ? (p.qa && !qaStale(p) ? 'done' : 'idle') : (p.final ? 'done' : 'idle'), icon: '' }; const dim = foc && !rel.has(n.id); const lk = isLocked(p, n.id); return `<g class="node" data-act="mapNode" data-id="${n.id}" opacity="${dim ? .3 : 1}"><rect x="${q.x}" y="${q.y}" width="${W}" height="${H}" rx="12" fill="${col(st.k)}" stroke="${foc === n.id ? '#cbff2e' : '#3a3a3d'}" stroke-width="${foc === n.id ? 2 : 1}"/><text x="${q.x + 10}" y="${q.y + 19}" font-weight="600">${esc((n.t.length > 27 ? n.t.slice(0, 26) + '…' : n.t))}</text><text x="${q.x + 10}" y="${q.y + 36}" fill="#a5a49d">${n.g === 'qa' || n.g === 'final' ? '' : (CFG.GROUPS[n.g].label + ' · ')}${st.icon || ''} ${lk ? '🔒' : ''}</text></g>`; }).join('') + `</svg>`;
  return pTop(p, 'Карта стратегії') + `<div class="wrap"><div class="infobox">Суцільна лінія — жорстка залежність (потрібна зафіксована), пунктир — бажана. Клікніть модуль, щоб підсвітити, від чого він залежить і що від нього залежить. Подвійний клік — перейти до модуля.</div><div style="overflow:auto">${svg}</div></div>`;
}
A.mapNode = (el, ev) => { const id = el.dataset.id; if (ev.detail > 1 && CFG.M[id]) { A.jump({ dataset: { id } }); return; } S.ui.mapFocus = S.ui.mapFocus === id ? null : id; render(); };

/* ---------- QA ---------- */
const QA_CATS = { consistency: 'Узгодженість — чи однакова аудиторія в різних каналах', brand: 'Узгодженість бренду — відповідність платформі бренду', funnel: 'Узгодженість воронки — логіка звʼязку каналів', contentads: 'Контент і реклама — чи контент підтримує рекламу', evidence: 'Докази — підґрунтя рішень', generic: 'Загальні фрази — шаблонний AI-текст' };
function qaView(p) {
  const q = p.qa; const stale = q && qaStale(p); const sc = qaScope(p);
  const all = q ? q.prog.concat(q.ai) : [];
  const ic = s => s === 'ok' ? '<span style="color:var(--ok)">✓ Узгоджено</span>' : s === 'warn' ? '<span style="color:var(--warn)">⚠ Потребує доопрацювання</span>' : '<span style="color:var(--bad)">✕ Конфлікт</span>';
  const body = q ? Object.keys(QA_CATS).map(c => { const fs = all.filter(f => f.cat === c); if (!fs.length) return ''; return `<div class="card"><h3>${QA_CATS[c]}</h3>${fs.sort((a, b) => ({ conflict: 0, warn: 1, ok: 2 }[a.status] - { conflict: 0, warn: 1, ok: 2 }[b.status])).map(f => `<div style="padding:7px 0;border-bottom:1px dashed var(--line)"><div class="row">${ic(f.status)} ${f.target && CFG.M[f.target] ? `<a data-act="jump" data-id="${f.target}" style="cursor:pointer" class="sm">${esc(titleOf(p, f.target))}</a>` : ''} ${f.src === 'ai' ? chip('AI-рецензент') : chip('авто')}</div><div>${esc(f.problem)}</div>${f.fix ? `<div class="sm t2">→ ${esc(f.fix)}</div>` : ''}</div>`).join('')}</div>`; }).join('') : '';
  return pTop(p, 'QA-перевірка', `<button class="btn pri" data-act="qa" ${S.ui.qaRunning ? 'disabled' : ''}>${S.ui.qaRunning ? '<span class="spinner"></span> Перевіряється…' : q ? '↻ Запустити повторно' : '▶ Запустити QA'}</button>`) + `<div class="wrap"><div class="infobox">Рецензент стратегії <b>не генерує нову стратегію</b> — він перевіряє готову. Замість оцінки «8/10» — чекліст із поясненням проблем. ${q ? `Наступний запуск перевірить лише змінені модулі та залежні від них${sc.length ? ': <b>' + sc.map(x => esc(titleOf(p, x))).join(', ') + '</b>' : ' (змін немає)'}.` : 'Перший запуск перевіряє весь проєкт.'}</div>${S.ui.qaErr ? `<div class="errbox">${esc(S.ui.qaErr)}</div>` : ''}${stale ? '<div class="warnbox">Після останньої QA-перевірки модулі змінились — результат неактуальний.</div>' : ''}
  ${q ? `<div class="row" style="margin-bottom:12px">${chip('✓ ' + q.summary.ok, 'ok')}${chip('⚠ ' + q.summary.warn, 'warn')}${chip('✕ ' + q.summary.conflict, 'bad')}<span class="muted sm">${fmtDate(q.runAt)} · ${esc(q.by)}</span><span style="flex:1"></span><button class="btn pri" data-act="page" data-v="final">До фінальної стратегії →</button></div>` : ''}${body}</div>`;
}
A.qa = () => runQA();

/* ---------- Фінальна стратегія ---------- */
function finalView(p) {
  const fm = finalModules(p); const f = p.final;
  const gate = !p.qa ? 'Спершу виконайте QA-перевірку.' : qaStale(p) ? 'QA неактуальна — повторіть перевірку.' : '';
  let body;
  if (!f) body = `<div class="card"><h3>Фінальна стратегія збирає лише підтверджені, актуальні й активні модулі</h3><div class="grid g2"><div><h4>Увійдуть (${fm.ok.length})</h4>${fm.ok.map(x => `<div class="sm">✓ ${esc(x.title)}</div>`).join('') || '<span class="muted">—</span>'}</div><div><h4>Не увійдуть (${fm.excl.length})</h4>${fm.excl.map(x => `<div class="sm">✕ ${esc(x.title)} — ${x.why}</div>`).join('') || '<span class="muted">—</span>'}</div></div>${gate ? `<div class="warnbox">${gate}</div>` : ''}<button class="btn pri" data-act="genFinal" ${gate ? 'disabled' : ''}>Сформувати Фінальна стратегія</button></div>`;
  else body = `<div class="card no-print"><div class="row"><b>Версія ${f.rev}</b><span class="muted sm">${fmtDate(f.generatedAt)} · ${esc(f.by)}</span><span style="flex:1"></span>${CFG.EXPORTERS.map(e => `<button class="btn sm" data-act="export" data-f="${e.id}" ${e.ready ? '' : 'disabled title="Phase 2"'}>${e.ready ? '⬇ ' : ''}${esc(e.label)}</button>`).join('')}<button class="btn sm" data-act="genFinal" ${gate ? 'disabled' : ''}>↻ Пересформувати</button></div>${gate ? `<div class="warnbox">${gate}</div>` : ''}${fm.excl.length ? `<div class="muted sm" style="margin-top:6px">Не увійшли: ${fm.excl.map(x => esc(x.title) + ' (' + x.why + ')').join('; ')}</div>` : ''}</div><div class="doc">${blocksToHtml(finalBlocks(p))}</div>${p.exports.length ? `<div class="card no-print" style="margin-top:14px"><h4>Історія експортів</h4>${p.exports.slice(0, 8).map(e => `<div class="sm">${fmtDate(e.at)} · ${esc(e.by)} · ${esc(e.format)}</div>`).join('')}</div>` : ''}`;
  return pTop(p, 'Фінальна стратегія') + `<div class="wrap">${body}</div>`;
}
A.genFinal = () => generateFinal();
A.export = el => doExport(el.dataset.f);

/* ---------- Історія ---------- */
function historyView(p) {
  const revs = S.ui.revs;
  if (!revs) api('/projects/' + p.id + '/revisions').then(r => { S.ui.revs = r; render(); }).catch(() => { S.ui.revs = []; });
  return pTop(p, 'Історія') + `<div class="wrap"><div class="card"><h3>Версії проєкту</h3><p class="muted sm">Знімки створюються при ключових подіях (генерація, фіксація, послуги, QA, фінал).</p>${(revs || []).map(r => `<div class="row" style="padding:5px 0;border-bottom:1px dashed var(--line)"><span class="sm muted" style="width:120px">${fmtDate(r.at)}</span><span style="flex:1">${esc(r.summary)} <span class="muted sm">· ${esc(r.by)}</span></span><button class="btn sm" data-act="restore" data-id="${r.id}">Відновити</button></div>`).join('') || '<span class="muted">Завантаження…</span>'}</div><div class="card"><h3>Журнал активності</h3>${p.log.map(l => `<div class="sm" style="padding:2px 0"><span class="muted">${fmtDate(l.at)} · ${esc(l.by)}</span> — ${esc(l.text)}</div>`).join('')}</div></div>`;
}
A.restore = async el => { if (!confirm('Відновити цю версію? Поточний стан буде замінено (його знімок залишиться в історії).')) return; try { const r = await api('/projects/' + S.project.id + '/revisions/' + el.dataset.id); const snap = r.snapshot; snap.id = S.project.id; S.project = snap; S.ui.revs = null; touch('Відновлено версію від ' + fmtDate(r.at)); toast('Версію відновлено'); render(); } catch (e) { toast(e.message, true); } };

/* ---------- Глобальні обробники ---------- */
document.addEventListener('click', ev => { const el = ev.target.closest('[data-act]'); if (!el) return; const f = A[el.dataset.act]; if (!f) return; if (el.tagName === 'A' || el.tagName === 'BUTTON') ev.preventDefault(); if (el.dataset.act === 'page' && el.dataset.tab) S.ui.tab.research = el.dataset.tab; if (el.dataset.act === 'page' && el.dataset.mod) { S.ui.open[el.dataset.mod] = true; const d = CFG.M[el.dataset.mod]; if (d && d.group === 'research') S.ui.tab.research = el.dataset.mod === 'insightsA' ? 'insights' : el.dataset.mod; } f(el, ev); });
document.addEventListener('input', ev => {
  const t = ev.target; const p = S.project;
  if (t.dataset.b !== undefined && p) { const k = t.dataset.b; if (k === '__owner') p.owner = t.value; else { p.brief[k] = t.value; if (k === 'name') p.name = t.value; } touch(); if (k !== '__owner') refreshBrief(); }
  else if (t.dataset.c !== undefined && p) { const [i, f] = t.dataset.c.split('.'); p.brief.competitors[+i][f] = t.value; touch(); refreshBrief(); }
  else if (t.dataset.instr && p) S.ui.instr[t.dataset.instr] = t.value;
  else if (t.dataset.adc) S.ui.adCountry = t.value.toUpperCase();
});
document.addEventListener('change', ev => {
  const t = ev.target; const p = S.project;
  if (t.dataset.e) { editField(t.dataset.m, t.dataset.s, t.dataset.i, t.dataset.f, t.value); }
  else if (t.dataset.rn && p) { const s = p.structure.find(x => x.id === t.dataset.rn); s.title = t.value.trim() === (CFG.M[s.id] ? CFG.M[s.id].title : '') ? '' : t.value.trim(); const c = p.custom.find(x => x.id === s.id); if (c) { c.title = t.value.trim() || c.title; s.title = ''; } touch(); }
  else if (t.dataset.b !== undefined && t.tagName === 'SELECT' && p) { if (t.dataset.b === 'bizModel') render(); }
});

/* ---------- Boot ---------- */
function askIdentity(needKey) {
  return new Promise(res => {
    modal(`<h3>Вхід у Конструктор стратегій</h3><label class="f"><span>Ваше імʼя (для історії змін і команди проєкту)</span><input type="text" id="id_name" value="${esc(S.user)}" autofocus></label>${needKey ? `<label class="f"><span>Командний ключ</span><input type="text" id="id_key" value="${esc(ls.get('aso_key') || '')}"></label>` : ''}<div class="row" style="justify-content:flex-end"><button class="btn pri" id="id_ok">Продовжити</button></div>`);
    $('#id_ok').onclick = () => { const n = $('#id_name').value.trim(); if (!n) return toast('Вкажіть імʼя', true); S.user = n; ls.set('aso_user', n); if (needKey) ls.set('aso_key', $('#id_key').value.trim()); closeModal(); res(); };
  });
}
async function boot() {
  S.user = ls.get('aso_user') || '';
  try { S.status = await api('/status'); } catch (e) { S.status = {}; }
  if (!S.user || (S.status.teamKeyRequired && !ls.get('aso_key'))) await askIdentity(S.status.teamKeyRequired);
  for (; ;) {
    try { S.projects = await api('/projects'); break; } catch (e) { if (e.status === 401) { toast('Невірний командний ключ', true); ls.set('aso_key', ''); await askIdentity(true); } else { toast('Сервер недоступний: ' + e.message, true); break; } }
  }
  try { S.lib = (await api('/kv/library')).value || []; S.prompts = (await api('/kv/prompts')).value || {}; } catch (e) { }
  render(); setInterval(syncTick, 8000);
  window.addEventListener('beforeunload', e => { if (S.dirty) { flush(); e.preventDefault(); e.returnValue = ''; } });
}
window.ASO = { S, CFG, runModule, api, render, openProject, setService, completeness, progress, statusOf, blockers, includedList, qaProgrammatic, finalBlocks, resolveRules, flush, touch, setState, runQA, generateFinal, parseTarget, boot };
boot();
</script>
</body>
</html>
